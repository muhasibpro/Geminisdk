<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUHASIB - Sardor va Madina Ovozli Multik Video</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #060911;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .bg-glow {
            position: fixed;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 40%, rgba(0, 242, 254, 0.12), rgba(121, 40, 202, 0.12), rgba(6, 9, 17, 0.95));
            z-index: -1;
            pointer-events: none;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        .tag-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 999px;
            color: #00f2fe;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #00f2fe 50%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
        }

        .video-box {
            position: relative;
            width: 100%;
            max-width: 960px;
            background: #0d1322;
            border-radius: 24px;
            border: 2px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 242, 254, 0.2);
            overflow: hidden;
        }

        #animationCanvas {
            width: 100%;
            height: auto;
            display: block;
            background-color: #111827;
        }

        .dialogue-overlay {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            background: rgba(10, 15, 29, 0.92);
            border: 2px solid rgba(0, 242, 254, 0.6);
            border-radius: 18px;
            padding: 16px 24px;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 242, 254, 0.3);
            z-index: 20;
        }

        .speaker-badge {
            background: linear-gradient(135deg, #00f2fe, #0072ff);
            color: #000;
            padding: 6px 14px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .dialogue-content {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.4;
        }

        .control-panel {
            padding: 16px 24px;
            background: #090d16;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .play-btn {
            background: linear-gradient(135deg, #00f2fe 0%, #0072ff 100%);
            border: none;
            color: #000;
            font-weight: 900;
            font-size: 15px;
            padding: 12px 28px;
            border-radius: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        .play-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.7);
        }

        .voice-info-badge {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.4);
            color: #fbbf24;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
        }

        .scene-nav {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn.active, .nav-btn:hover {
            background: rgba(0, 242, 254, 0.2);
            border-color: #00f2fe;
            color: #00f2fe;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <header>
        <div class="tag-badge">🎙 Real Sardor Neural & Madina Neural Voices</div>
        <h1>MUHASIB - Sardor va Madina Ovozli Multik</h1>
        <p class="subtitle">Robot ovozlardan holi, rasmiy O'zbek tili Neural ovozli multik-video!</p>
    </header>

    <div class="video-box">
        <canvas id="animationCanvas" width="960" height="540"></canvas>

        <div class="dialogue-overlay" id="dialogueOverlay">
            <div class="speaker-badge" id="speakerName">👩 Madina (Diktor)</div>
            <div class="dialogue-content" id="dialogueText">Quvnoq bola do'konga kiradi va o'ziga kerakli mahsulot hamda shirinliklarni tanlaydi.</div>
        </div>

        <div class="control-panel">
            <button class="play-btn" id="playBtn">
                ▶ Multikni Boshlash
            </button>

            <div class="voice-info-badge">
                🎙 Ovoz: Sardor & Madina Neural
            </div>

            <div class="scene-nav">
                <button class="nav-btn active" onclick="switchScene(0)">1. Kirish</button>
                <button class="nav-btn" onclick="switchScene(1)">2. Kassa</button>
                <button class="nav-btn" onclick="switchScene(2)">3. Savol</button>
                <button class="nav-btn" onclick="switchScene(3)">4. MUHASIB POS</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('animationCanvas');
        const ctx = canvas.getContext('2d');

        const img1 = new Image(); img1.src = 'images/scene_1.jpg';
        const img2 = new Image(); img2.src = 'images/scene_2.jpg';
        const img3 = new Image(); img3.src = 'images/scene_3.jpg';
        const img4 = new Image(); img4.src = 'images/scene_4.jpg';

        const sceneImages = [img1, img2, img3, img4];

        const audioS1 = new Audio('audio/s1.mp3');
        const audioS2 = new Audio('audio/s2.mp3');
        const audioS3 = new Audio('audio/s3.mp3');
        const audioS4 = new Audio('audio/s4.mp3');

        const scenes = [
            {
                speaker: "👩 Madina (Diktor)",
                text: "Quvnoq bola do'konga kiradi, javondan yaxshilab energetik ichimlik tanlab oladi va kassa taraqqat boradi.",
                audio: audioS1,
                duration: 5500
            },
            {
                speaker: "👵 Madina (Kassachi Opa)",
                text: "Uka, energetik ichimligingiz hammasi bo'lib 25,000 so'm bo'ldi.",
                audio: audioS2,
                duration: 5500
            },
            {
                speaker: "👦 Sardor (Xaridor Bola)",
                text: "Vay! Nega sizlarda MUHASIB dasturi yo'q?! Muhasib bo'lsa tezroq va qulayroq bo'lardi-ku!",
                audio: audioS3,
                duration: 5000
            },
            {
                speaker: "🚀 Sardor (MUHASIB POS System)",
                text: "MUHASIB dasturi o'rnatildi! Endi 1 soniyada skanerlash, aniq hisob-kitob va zamonaviy POS kassa!",
                audio: audioS4,
                duration: 7000
            }
        ];

        let currentScene = 0;
        let isPlaying = false;
        let animFrame = null;
        let frameCount = 0;

        function stopAllAudio() {
            scenes.forEach(s => {
                s.audio.pause();
                s.audio.currentTime = 0;
            });
        }

        function renderAnimation() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const bgImg = sceneImages[currentScene];
            
            if (bgImg && bgImg.complete) {
                const zoom = 1 + Math.sin(frameCount * 0.015) * 0.03;
                const shiftX = Math.cos(frameCount * 0.01) * 8;
                const shiftY = Math.sin(frameCount * 0.01) * 5;

                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(zoom, zoom);
                ctx.drawImage(bgImg, -canvas.width / 2 + shiftX, -canvas.height / 2 + shiftY, canvas.width, canvas.height);
                ctx.restore();
            }

            if (currentScene === 2) {
                const mouthOpen = Math.abs(Math.sin(frameCount * 0.25)) * 14 + 2;
                ctx.save();
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.ellipse(330, 280, 8, mouthOpen / 2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = 'bold 36px Outfit';
                ctx.fillStyle = '#00f2fe';
                ctx.fillText('?', 360 + Math.sin(frameCount * 0.1) * 10, 200 + Math.cos(frameCount * 0.1) * 8);
                ctx.restore();
            } else if (currentScene === 3) {
                const laserX = 400 + Math.sin(frameCount * 0.08) * 140;
                ctx.save();
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.moveTo(laserX, 220);
                ctx.lineTo(laserX, 360);
                ctx.stroke();
                ctx.restore();
            }

            if (isPlaying) {
                animFrame = requestAnimationFrame(renderAnimation);
            }
        }

        function switchScene(index) {
            stopAllAudio();
            currentScene = index;

            document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });

            document.getElementById('speakerName').innerText = scenes[index].speaker;
            document.getElementById('dialogueText').innerText = scenes[index].text;

            scenes[index].audio.play().catch(e => console.log('Audio autoplay info:', e));
        }

        function playNextSceneSequence() {
            if (!isPlaying) return;

            switchScene(currentScene);

            setTimeout(() => {
                if (isPlaying) {
                    currentScene = (currentScene + 1) % scenes.length;
                    playNextSceneSequence();
                }
            }, scenes[currentScene].duration);
        }

        document.getElementById('playBtn').addEventListener('click', () => {
            if (isPlaying) {
                isPlaying = false;
                document.getElementById('playBtn').innerText = '▶ Multikni Boshlash';
                cancelAnimationFrame(animFrame);
                stopAllAudio();
            } else {
                isPlaying = true;
                document.getElementById('playBtn').innerText = '⏸ To'xtatish';
                renderAnimation();
                playNextSceneSequence();
            }
        });

        renderAnimation();
    </script>
</body>
</html>
