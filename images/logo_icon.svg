<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Primary Gradient -->
    <linearGradient id="muhasibBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Growth & Accent Gradient -->
    <linearGradient id="muhasibCyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="muhasibGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Stylized Letter M with Scan Lines & Revenue Arrow -->
  <g filter="url(#dropShadow)">
    
    <!-- Outer Shield / Container subtle contour (Optional overlay) -->
    <rect x="24" y="24" width="464" height="464" rx="96" fill="#0F172A" opacity="0.0" />

    <!-- Left Vertical Stem & Circuit Barcode Nodes -->
    <path d="M 100 130 L 100 380 L 145 380 L 145 200 L 100 130 Z" fill="url(#muhasibBlueGrad)" />
    
    <!-- Horizontal Tech Scan Lines entering 'M' -->
    <rect x="60" y="275" width="65" height="12" rx="6" fill="url(#muhasibBlueGrad)" />
    <circle cx="50" cy="281" r="7" fill="#38BDF8" />
    
    <rect x="75" y="305" width="50" height="10" rx="5" fill="url(#muhasibBlueGrad)" opacity="0.85" />
    <circle cx="65" cy="310" r="5" fill="#38BDF8" opacity="0.85" />

    <!-- Main 'M' Center Peak & Diagonal Valley -->
    <path d="M 145 200 L 256 340 L 320 250 L 270 200 L 256 220 L 180 130 Z" fill="url(#muhasibBlueGrad)" />

    <!-- Right Stem & Dynamic Ascending Growth Arrow -->
    <!-- Lower Right Leg of M -->
    <path d="M 367 250 L 367 380 L 412 380 L 412 180 Z" fill="url(#muhasibCyanGrad)" />

    <!-- Dynamic Growth Arrow Cutting Across M to Top-Right -->
    <path d="M 185 340 L 390 120 L 340 120 L 340 85 L 445 85 L 445 190 L 410 190 L 410 140 L 215 355 Z" fill="url(#muhasibCyanGrad)" filter="url(#glowBlue)" />

    <!-- Scanner Beam Pulse line along arrow -->
    <path d="M 230 315 L 390 155" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.75" />

    <!-- Tech Circuit Nodes on Growth Arrow -->
    <circle cx="280" cy="265" r="5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="340" cy="205" r="5" fill="#FFFFFF" opacity="0.9" />

    <!-- Gold Sparkle / Star of Excellence (POS Speed & Accuracy) -->
    <path d="M 435 70 L 440 55 L 455 50 L 440 45 L 435 30 L 430 45 L 415 50 L 430 55 Z" fill="url(#muhasibGoldGrad)" />

  </g>
</svg>
