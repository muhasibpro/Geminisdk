<script>
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp  = (a,b,t) => a + (b-a)*t;
const ease  = t => t<0 ? 0 : t>1 ? 1 : t*t*(3-2*t);
const easeOut = t => 1-Math.pow(1-clamp(t,0,1),3);
const seg = (t,t0,t1) => clamp((t-t0)/Math.max(0.0001,t1-t0),0,1);
const T   = (g,tr) => g.setAttribute('transform',tr);

let TL = {
  duration: 32,
  lines: [
    {who:'cash', start:12.2, dur:3.6},
    {who:'boy',  start:17.6, dur:4.4},
    {who:'boy',  start:24.0, dur:4.8}
  ],
  price: "25 000 so'm",
  cashText: ["Uka, energetik ichimligingiz", "25 000 so'm bo'ldi."],
  boyText:  ["Vay!", "Nega sizlarda MUHASIB", "dasturi yo'q?!"]
};
window.DURATION = TL.duration;

window.APPLY_CONFIG = function(){
  if(!window.CONFIG) return;
  TL = Object.assign(TL, window.CONFIG);
  window.DURATION = TL.duration;
  fillTexts();
};

function fillTexts(){
  $('bcT1').textContent = TL.cashText[0] || '';
  $('bcT2').textContent = TL.cashText[1] || '';
  $('bbT1').textContent = TL.boyText[0] || '';
  $('bbT2').textContent = TL.boyText[1] || '';
  $('bbT3').textContent = TL.boyText[2] || '';
  $('posPrice').textContent = TL.price;
}

(function decor(){
  let s = '';
  for(let x=-400; x<2600; x+=160)
    s += `<path d="M${x},880 L${x+80},1080" stroke="#8aa0ba" stroke-width="3" fill="none"/>`;
  for(let y=920; y<1080; y+=52)
    s += `<line x1="-400" y1="${y}" x2="2600" y2="${y}" stroke="#8aa0ba" stroke-width="3"/>`;
  $('tiles').innerHTML = s;

  let c = '';
  const rows = [320, 470, 620, 760];
  rows.forEach((y,ri) => {
    c += `<rect x="356" y="${y+64}" width="378" height="10" rx="5" fill="#b9cddd"/>`;
    for(let i=0;i<7;i++){
      const x = 380 + i*52, hidden = (ri===1 && i===3);
      c += `<g opacity="${hidden?0:1}" id="${hidden?'shelfGap':''}">
              <rect x="${x-14}" y="${y}" width="28" height="64" rx="6" fill="${ri%2?'#12a45c':'#1d63d8'}"/>
              <rect x="${x-14}" y="${y}" width="28" height="10" rx="5" fill="#cfd8dc"/>
            </g>`;
    }
  });
  $('shelfCans').innerHTML = c;

  let b = '';
  for(let i=0;i<8;i++){
    const x = 900 + i*72, h = 60 + (i%3)*18;
    b += `<rect x="${x}" y="${330-h}" width="52" height="${h}" rx="6" fill="${['#f0b48d','#9fc6e8','#f6d365','#c8e6c9'][i%4]}"/>`;
    b += `<rect x="${x}" y="${520-h+10}" width="52" height="${h-10}" rx="6" fill="${['#e8a67d','#b0d4f1','#f7e08a','#b7ddb9'][i%4]}"/>`;
  }
  $('shelfBoxes').innerHTML = b;

  let sp = '';
  for(let i=0;i<26;i++)
    sp += `<circle class="spark" cx="0" cy="0" r="${3+ (i%4)}" fill="${['#4285f4','#ea4335','#fbbc05','#34a853'][i%4]}" opacity="0"/>`;
  $('sparks').innerHTML = sp;
  fillTexts();
})();
const SPARKS = Array.from(document.querySelectorAll('.spark'));

function poseLeg(hip, knee, a1, a2, up){ T(hip,`translate(0,${up}) rotate(${a1})`); T(knee,`translate(0,90) rotate(${a2})`); }
function poseArm(sh, el, a1, a2, up){ T(sh,`translate(0,${up}) rotate(${a1})`); T(el,`translate(0,76) rotate(${a2})`); }

function armTip(sx, sy, a1, a2, l1, l2){
  const r1 = a1*Math.PI/180, r2 = a2*Math.PI/180;
  const ex = sx - l1*Math.sin(r1), ey = sy + l1*Math.cos(r1);
  const fx = -l2*Math.sin(r2),    fy = l2*Math.cos(r2);
  return [ ex + fx*Math.cos(r1) - fy*Math.sin(r1),
           ey + fx*Math.sin(r1) + fy*Math.cos(r1) ];
}

function mouthTalk(mouthEl, smileEl, on, t, speed){
  if(on){
    const o = 0.5 + 0.5*Math.sin(t*(speed||24));
    mouthEl.setAttribute('ry', (3 + o*11).toFixed(2));
    mouthEl.setAttribute('rx', (16 - o*4).toFixed(2));
    mouthEl.setAttribute('opacity', 1);
    smileEl.setAttribute('opacity', 0);
  } else {
    mouthEl.setAttribute('opacity', 0);
    smileEl.setAttribute('opacity', 1);
  }
}
function blink(eyeL, eyeR, t, phase){
  const p = ((t + (phase||0)) % 3.4);
  const k = p < 0.13 ? Math.abs(Math.cos(p/0.13*Math.PI/2)) : 1;
  const sy = clamp(k, 0.06, 1);
  T(eyeL, `translate(0,${(1-sy)*2}) scale(1,${sy})`);
  T(eyeR, `translate(0,${(1-sy)*2}) scale(1,${sy})`);
}

function beats(){
  const L = TL.lines;
  return {
    walkIn:  [0.4, 3.6],
    toFridge:[3.6, 6.2],
    grab:    [6.2, 8.4],
    toDesk:  [8.4, L[0].start-0.6],
    cashLine:[L[0].start, L[0].start + L[0].dur],
    boyLine: [L[1].start, L[1].start + L[1].dur],
    posIn:   [L[2].start - 1.2, L[2].start + 0.6],
    scan:    [L[2].start + 0.8, L[2].start + 2.2],
    outro:   [L[2].start + TL.lines[2].dur - 0.4, TL.duration]
  };
}

window.SEEK = function(t){
  const B = beats();
  const FLOOR = 880;

  let bx, walking = false;
  if(t < B.walkIn[0]){ bx = -180; }
  else if(t <= B.walkIn[1]){ bx = lerp(-180, 300, ease(seg(t,B.walkIn[0],B.walkIn[1]))); walking = true; }
  else if(t <= B.toFridge[1]){ bx = lerp(300, 640, ease(seg(t,B.toFridge[0],B.toFridge[1]))); walking = true; }
  else if(t <= B.grab[1]){ bx = 640; }
  else if(t <= B.toDesk[1]){ bx = lerp(640, 1130, ease(seg(t,B.toDesk[0],B.toDesk[1]))); walking = true; }
  else { bx = 1130; }

  const boyH = 340;
  const hipY = FLOOR - boyH + 155;
  const stride = walking ? Math.sin(t * 11) : 0;
  const bob    = walking ? Math.abs(Math.sin(t * 11)) * 14 : Math.sin(t * 2) * 3;

  T($('boy'), `translate(${bx.toFixed(1)}, ${(hipY - bob).toFixed(1)})`);

  let lF1 = stride * 34, lF2 = Math.max(0, -stride) * 38;
  let lB1 = -stride * 34, lB2 = Math.max(0, stride) * 38;
  poseLeg($('boyLegF'), $('boyKneeF'), lF1, lF2, 0);
  poseLeg($('boyLegB'), $('boyKneeB'), lB1, lB2, -4);

  const headRot = walking ? stride * 3 : (t >= B.boyLine[0] && t <= B.boyLine[1] ? Math.sin(t*14)*4 : 0);
  T($('boyHead'), `translate(0, -145) rotate(${headRot.toFixed(1)})`);

  let aF1 = -stride * 28, aF2 = 18;
  let aB1 = stride * 28, aB2 = 14;

  const inGrab = seg(t, B.grab[0], B.grab[1]);
  if(inGrab > 0 && t < B.toDesk[0]){
    const g = ease(seg(t, B.grab[0], B.grab[0]+0.8));
    const g2 = ease(seg(t, B.grab[0]+1.1, B.grab[1]));
    aF1 = lerp(aF1, -78, g) - lerp(0, 15, g2);
    aF2 = lerp(aF2, -28, g) + lerp(0, 48, g2);
  }
  if(t >= B.toDesk[0]){
    aF1 = -45 + Math.sin(t*2)*2;
    aF2 = 55;
  }
  const shouting = t >= B.boyLine[0] && t <= B.boyLine[1];
  if(shouting){
    aF1 = -110 + Math.sin(t*18)*12; aF2 = -20;
    aB1 = 80 + Math.sin(t*18)*10; aB2 = 30;
  }

  poseArm($('boyArmF'), $('boyElbowF'), aF1, aF2, -135);
  poseArm($('boyArmB'), $('boyElbowB'), aB1, aB2, -135);

  blink($('boyEyeL'), $('boyEyeR'), t, 0);
  const boySpeaking = (t >= B.boyLine[0] && t <= B.boyLine[1]) || (t >= TL.lines[2].start && t <= TL.lines[2].start + TL.lines[2].dur);
  mouthTalk($('boyMouth'), $('boySmile'), boySpeaking, t, 26);

  if(shouting){
    T($('boyBrowL'), `translate(0,-5) rotate(14)`);
    T($('boyBrowR'), `translate(0,-5) rotate(-14)`);
  } else {
    T($('boyBrowL'), `translate(0,0) rotate(0)`);
    T($('boyBrowR'), `translate(0,0) rotate(0)`);
  }

  /* ── KASSIR (MASTER SHIFU) ── */
  const cashX = 1620, cashH = 300;
  const cashHipY = FLOOR - cashH + 130;
  T($('cashier'), `translate(${cashX}, ${cashHipY})`);

  let cAF1 = 18 + Math.sin(t*1.8)*4, cAF2 = 35;
  let cAB1 = -12, cAB2 = 25;
  const cashSpeaking = t >= B.cashLine[0] && t <= B.cashLine[1];
  if(cashSpeaking){
    cAF1 = -35 + Math.sin(t*12)*14; cAF2 = 45;
  }
  poseArm($('cashArmF'), $('cashElbowF'), cAF1, cAF2, -110);
  poseArm($('cashArmB'), $('cashElbowB'), cAB1, cAB2, -110);
  T($('cashHead'), `translate(0, -120) rotate(${cashSpeaking ? Math.sin(t*10)*3 : 0})`);
  blink($('cashEyeL'), $('cashEyeR'), t, 1.2);
  mouthTalk($('cashMouth'), $('cashSmile'), cashSpeaking, t, 22);

  /* ── BANKA (Energetik) ── */
  const can = $('can');
  if(t < B.grab[0] + 0.6){
    can.setAttribute('opacity', 0);
  } else {
    can.setAttribute('opacity', 1);
    const handWorld = armTip(bx, hipY - bob - 135, aF1, aF2, 76, 70);
    let canX = handWorld[0] + 8, canY = handWorld[1] + 20;
    if(t >= B.toDesk[1]){
      const deskProgress = ease(seg(t, B.toDesk[1], B.toDesk[1] + 0.5));
      canX = lerp(canX, 1209, deskProgress);
      canY = lerp(canY, 650, deskProgress);
    }
    T(can, `translate(${canX.toFixed(1)}, ${canY.toFixed(1)})`);
  }

  /* ── MUHASIB POS terminal ── */
  const inPos = seg(t, B.posIn[0], B.posIn[1]);
  const posEl = $('pos'), oldEl = $('oldWay');
  if(inPos > 0){
    posEl.setAttribute('opacity', ease(inPos));
    oldEl.setAttribute('opacity', 1 - ease(inPos));
  } else if(t >= B.posIn[1]){
    posEl.setAttribute('opacity', 1); oldEl.setAttribute('opacity', 0);
  } else {
    posEl.setAttribute('opacity', 0); oldEl.setAttribute('opacity', 1);
  }

  const inScan = seg(t, B.scan[0], B.scan[1]);
  $('beam').setAttribute('opacity', (inScan > 0 && inScan < 1) ? 1 : 0);
  if(t >= B.scan[1]){
    $('posPrice').textContent = TL.price;
    $('posPrice').setAttribute('fill', '#ffffff');
  } else {
    $('posPrice').textContent = '—';
  }

  const recP = seg(t, B.scan[1] + 0.2, B.scan[1] + 1.2);
  const recEl = $('receipt');
  if(recP > 0){
    recEl.setAttribute('opacity', 1);
    const h = lerp(10, 110, ease(recP));
    $('receiptPaper').setAttribute('height', h.toFixed(0));
    let rl = '';
    if(h > 35) rl += `<rect x="1586" y="614" width="70" height="6" rx="2"/>`;
    if(h > 60) rl += `<rect x="1586" y="630" width="92" height="6" rx="2"/>`;
    if(h > 85) rl += `<rect x="1586" y="646" width="50" height="6" rx="2"/>`;
    $('receiptLines').innerHTML = rl;
  } else {
    recEl.setAttribute('opacity', 0);
  }

  /* ── MULOQOT PUFACSI VA SHOK ── */
  const shock = $('shock');
  if(shouting){
    shock.setAttribute('opacity', 1);
    const sk = 1 + Math.sin(t*22)*0.15;
    T(shock, `translate(${bx}, ${hipY - bob - 360}) scale(${sk})`);
  } else {
    shock.setAttribute('opacity', 0);
  }

  const bc = $('bubbleCash');
  if(cashSpeaking){
    bc.setAttribute('opacity', 1);
    T(bc, `translate(1120, 240)`);
  } else { bc.setAttribute('opacity', 0); }

  const bb = $('bubbleBoy');
  if(shouting){
    bb.setAttribute('opacity', 1);
    T(bb, `translate(${clamp(bx - 260, 40, 1200)}, 210)`);
  } else { bb.setAttribute('opacity', 0); }

  /* ── ESHIK VA MUZLATGICH DOIRASI ── */
  const doorAngle = (t >= B.walkIn[0]-0.2 && t <= B.walkIn[0]+1.2) ? Math.sin(seg(t, B.walkIn[0]-0.2, B.walkIn[0]+1.2)*Math.PI)*55 : 0;
  T($('doorPanel'), `translate(-146, 254) rotate(${-doorAngle}, 0, 300)`);

  /* ── KAMERA (ZOOM VA PAN) ── */
  let camX = 0, camY = 0, camScale = 1;
  if(t >= B.walkIn[0] && t <= B.walkIn[1]){
    camX = lerp(0, -100, ease(seg(t, B.walkIn[0], B.walkIn[1])));
  } else if(t >= B.toFridge[0] && t <= B.grab[1]){
    camX = lerp(-100, -220, ease(seg(t, B.toFridge[0], B.grab[1])));
    camY = -40; camScale = 1.12;
  } else if(t >= B.toDesk[0] && t <= B.toDesk[1]){
    camX = lerp(-220, -320, ease(seg(t, B.toDesk[0], B.toDesk[1])));
    camY = lerp(-40, -20, ease(seg(t, B.toDesk[0], B.toDesk[1])));
    camScale = lerp(1.12, 1.08, ease(seg(t, B.toDesk[0], B.toDesk[1])));
  } else if(t > B.toDesk[1] && t < B.outro[0]){
    camX = -360; camY = -30; camScale = 1.14;
  }
  T($('cam'), `translate(${(960 + camX*camScale).toFixed(1)}, ${(540 + camY*camScale).toFixed(1)}) scale(${camScale.toFixed(3)}) translate(-960, -540)`);

  /* ── YAKUNIY BRAND EKRANI (OUTRO) ── */
  const outro = $('outro');
  const inOutro = seg(t, B.outro[0], B.outro[0] + 0.8);
  if(inOutro > 0){
    outro.setAttribute('opacity', ease(inOutro));
    const sc = lerp(0.8, 1, ease(inOutro));
    T($('outroLogo'), `translate(0, ${(1-ease(inOutro))*-40}) scale(${sc})`);

    const bP = seg(t, B.outro[0] + 0.5, B.outro[0] + 1.2);
    $('outroBullets').setAttribute('opacity', ease(bP));

    /* Uchqunlar portlashi */
    const spP = seg(t, B.outro[0], B.outro[0] + 1.4);
    SPARKS.forEach((sp, i) => {
      const angle = (i / SPARKS.length) * Math.PI * 2;
      const dist = spP * (280 + (i % 5) * 80);
      const x = 960 + Math.cos(angle) * dist;
      const y = 390 + Math.sin(angle) * dist;
      sp.setAttribute('cx', x.toFixed(1));
      sp.setAttribute('cy', y.toFixed(1));
      sp.setAttribute('opacity', (1 - spP).toFixed(2));
    });
  } else {
    outro.setAttribute('opacity', 0);
  }
};

SEEK(0);
</script>
