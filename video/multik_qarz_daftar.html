<script>
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp  = (a,b,t) => a + (b-a)*t;
const ease  = t => t<0 ? 0 : t>1 ? 1 : t*t*(3-2*t);
const easeOut = t => 1-Math.pow(1-clamp(t,0,1),3);
const seg = (t,t0,t1) => clamp((t-t0)/Math.max(0.0001,t1-t0),0,1);
const T   = (g,tr) => g.setAttribute('transform',tr);
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');

/* ── vaqt jadvali (render paytida window.CONFIG bilan almashtiriladi) ──
   lines: 0-ota, 1-Madina, 2-ota telefonga, 3-Madina, 4-ota, 5-yakuniy ovoz */
let TL = {
  duration: 40,
  lines: [
    {who:'dad', start:1.2,  dur:4.6},
    {who:'mad', start:8.4,  dur:4.8},
    {who:'dad', start:14.8, dur:2.6},
    {who:'mad', start:19.8, dur:4.4},
    {who:'dad', start:27.0, dur:3.0},
    {who:'mad', start:31.6, dur:3.0}
  ],
  bubbles: [
    ["Alisher qancha qarz edi?!", "Daftarning beti qani?"],
    ["Dadajon, daftarni qo'ying!", "MUHASIBga gapiring."],
    null,
    ["Kassa, qarzdorlar, foyda —", "hammasi tepada!"],
    ["Zo'r-ku! Endi bitta so'm", "ham yo'qolmaydi!"],
    null
  ],
  transcript: "Alisherga ikki yuz ming qarz berdim.",
  userMsg: ["Alisherga ikki yuz ming", "qarz berdim."],
  who: "Alisher",
  amount: 200000,
  kassa0: 3450000,
  foyda: 1280000,
  outroSub: "Siz gapiring — u hisoblaydi",
  chips: ["Qarzlar", "Kassa", "Ombor", "Foyda"]
};
window.DURATION = TL.duration;

window.APPLY_CONFIG = function(){
  if(!window.CONFIG) return;
  TL = Object.assign(TL, window.CONFIG);
  window.DURATION = TL.duration;
  build();
};

/* ── gap puffagi: dumi personaj tomonga qaraydi ── */
function bubblePath(w, h, tailX, tailDx){
  const r = 26;
  return `M${r},0 h${w-2*r} a${r},${r} 0 0 1 ${r},${r} v${h-2*r} a${r},${r} 0 0 1 -${r},${r}`
       + ` H${tailX+34} l${tailDx},58 L${tailX-10},${h} H${r} a${r},${r} 0 0 1 -${r},-${r}`
       + ` v-${h-2*r} a${r},${r} 0 0 1 ${r},-${r} z`;
}

/* puffak joylari (dunyo koordinatasi): [x, y, kenglik, dum x, dum siljishi] */
const BUB_POS = {
  0: [700, 250, 600, 360, 40],
  1: [250, 290, 600, 380, 10],
  3: [360, 210, 600, 230, -10],
  4: [620, 230, 620, 380, 30]
};

function build(){
  let bh = '';
  TL.bubbles.forEach((b, i) => {
    if(!b || !BUB_POS[i]) return;
    const [, , w, tx, tdx] = BUB_POS[i];
    const red = TL.lines[i] && TL.lines[i].who === 'dad' && i === 0;
    bh += `<g id="bub${i}" opacity="0">
      <path d="${bubblePath(w, 150, tx, tdx)}" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
      <text x="${w/2}" y="64" font-size="40" font-weight="800" fill="${red?'#b91c1c':'#1f2937'}" text-anchor="middle">${b[0]||''}</text>
      <text x="${w/2}" y="116" font-size="40" font-weight="700" fill="#1f2937" text-anchor="middle">${b[1]||''}</text>
    </g>`;
  });
  $('bubbles').innerHTML = bh;

  $('um1').textContent = TL.userMsg[0] || '';
  $('um2').textContent = TL.userMsg[1] || '';
  $('rWho').textContent = TL.who;
  $('rSum').textContent = fmt(TL.amount) + " so'm";
  $('outroSub').textContent = TL.outroSub;

  let ch = '', cx = 960 - (TL.chips.length*220 - 20)/2;
  const cols = ['#ef4444','#3b82f6','#f59e0b','#22c55e'];
  TL.chips.forEach((c,i) => {
    const x = cx + i*220;
    ch += `<g class="chip"><rect x="${x}" y="660" width="200" height="64" rx="32" fill="none" stroke="${cols[i%4]}" stroke-width="4"/>
           <text x="${x+100}" y="703" font-size="30" font-weight="700" fill="${cols[i%4]}" text-anchor="middle">${c}</text></g>`;
  });
  $('outroChips').innerHTML = ch;
}

/* ── bir marta chiziladigan bezaklar ── */
(function decor(){
  let s = '';
  for(let y=900; y<1300; y+=46)
    s += `<line x1="-600" y1="${y}" x2="2800" y2="${y}" stroke="#4a2c12" stroke-width="3"/>`;
  for(let i=0;i<60;i++){
    const y = 900 + (i%9)*46, x = -600 + ((i*397)%3400);
    s += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y+46}" stroke="#4a2c12" stroke-width="3"/>`;
  }
  $('planks').innerHTML = s;

  let g = '';
  const pal = ['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899','#14b8a6'];
  [300, 470].forEach((y, r) => {
    for(let i=0;i<13;i++){
      const x = 620 + i*66, h = 70 + ((i*7+r*3)%4)*18, c = pal[(i+r*2)%pal.length];
      if(i%3===1){                                     /* banka */
        g += `<rect x="${x}" y="${y-h+10}" width="48" height="${h-10}" rx="10" fill="${c}" opacity="0.9"/>
              <rect x="${x+4}" y="${y-h+4}" width="40" height="14" rx="5" fill="#f8fafc"/>`;
      } else {                                         /* quti */
        g += `<rect x="${x}" y="${y-h}" width="54" height="${h}" rx="6" fill="${c}"/>
              <rect x="${x+8}" y="${y-h+16}" width="38" height="12" rx="4" fill="#fff" opacity="0.75"/>`;
      }
    }
  });
  $('goods').innerHTML = g;

  let p = '';
  for(let i=0;i<8;i++)
    p += `<g class="paper" opacity="0"><rect x="-34" y="-24" width="68" height="48" rx="3" fill="#fffaf0" stroke="#c9b98f" stroke-width="2"/>
          <line x1="-24" y1="-10" x2="24" y2="-10" stroke="#94a3b8" stroke-width="2"/>
          <line x1="-24" y1="2" x2="20" y2="2" stroke="#94a3b8" stroke-width="2"/>
          <line x1="-24" y1="14" x2="10" y2="14" stroke="#94a3b8" stroke-width="2"/></g>`;
  $('papers').innerHTML = p;

  let w = '';
  for(let i=0;i<14;i++) w += `<rect class="wbar" x="${1226 + i*20}" y="944" width="10" height="20" rx="5" fill="#60a5fa"/>`;
  $('wave').innerHTML = w;

  let pf = '';
  for(let i=0;i<10;i++) pf += `<circle class="pf" r="${10+(i%3)*5}" fill="#e2e8f0"/>`;
  $('puff').innerHTML = pf;

  let sp = '';
  for(let i=0;i<30;i++)
    sp += `<circle class="spark" r="${3+(i%4)}" fill="${['#3b82f6','#ef4444','#facc15','#22c55e'][i%4]}" opacity="0"/>`;
  $('sparks').innerHTML = sp;
  build();
})();
const PAPERS = Array.from(document.querySelectorAll('.paper'));
const WBARS  = Array.from(document.querySelectorAll('.wbar'));
const PUFFS  = Array.from(document.querySelectorAll('.pf'));
const SPARKS = Array.from(document.querySelectorAll('.spark'));
const DOTS   = Array.from(document.querySelectorAll('.dot'));

/* ── rig ── */
function poseLimb(sh, el, x, up, a1, a2, L1){
  T(sh, `translate(${x},${up}) rotate(${a1.toFixed(2)})`);
  T(el, `translate(0,${L1}) rotate(${a2.toFixed(2)})`);
}
/* kaft koordinatasi: SVG rotate(θ) (0,L) → (-L·sinθ, L·cosθ) */
function limbTip(sx, sy, a1, a2, l1, l2){
  const r1 = a1*Math.PI/180, r2 = (a1+a2)*Math.PI/180;
  return [sx - l1*Math.sin(r1) - l2*Math.sin(r2), sy + l1*Math.cos(r1) + l2*Math.cos(r2)];
}
function mouthTalk(m, s, on, t, speed, base){
  if(on){
    const o = 0.5 + 0.5*Math.sin(t*(speed||24)) * (0.6 + 0.4*Math.sin(t*7.3));
    m.setAttribute('ry', (3 + o*(base||10)).toFixed(2));
    m.setAttribute('opacity', 1); s.setAttribute('opacity', 0);
  } else { m.setAttribute('opacity', 0); s.setAttribute('opacity', 1); }
}
function blink(eL, eR, t, phase){
  const p = ((t + (phase||0)) % 3.6);
  const k = p < 0.14 ? Math.abs(Math.cos(p/0.14*Math.PI/2)) : 1;
  const sy = clamp(k, 0.08, 1);
  T(eL, `translate(0,${(1-sy)*2}) scale(1,${sy})`);
  T(eR, `translate(0,${(1-sy)*2}) scale(1,${sy})`);
}

/* ── sahna vaqtlari ── */
function beats(){
  const L = TL.lines.map(l => [l.start, l.start + l.dur]);
  const send = L[2][1] + 0.25;
  const outro = L[4][1] + 0.5;
  return {
    L, send,
    walk:     [L[0][1] - 0.6, L[1][0] - 0.3],
    phoneIn:  [L[1][1] + 0.1, L[1][1] + 1.2],
    typing:   [send + 0.35, send + 1.3],
    reply:    send + 1.3,
    count:    [send + 1.5, send + 2.6],
    phoneOut: [L[3][1] + 0.3, L[3][1] + 1.2],
    grab:     [L[3][1] + 0.6, L[3][1] + 1.3],
    lift:     [L[3][1] + 1.3, L[3][1] + 1.9],
    fly:      [L[3][1] + 1.9, L[3][1] + 2.8],
    outro
  };
}

/* kamera kalit kadrlari: markaz (cx,cy) va masshtab s */
function camKeys(B){
  return [
    [0,                 960, 540, 1.00],
    [1.0,              1000, 560, 1.14],
    [B.walk[0],        1000, 560, 1.14],
    [B.walk[0] + 1.4,   860, 540, 1.00],
    [B.L[1][1],         860, 540, 1.00],
    [B.phoneIn[1],     1270, 540, 1.00],
    [B.phoneOut[0],    1270, 540, 1.00],
    [B.phoneOut[1],    1120, 540, 1.00],
    [B.fly[1] + 0.3,   1120, 540, 1.00],
    [B.L[4][0] + 0.2,  1000, 560, 1.10]
  ];
}
function camAt(t, keys){
  if(t <= keys[0][0]) return keys[0].slice(1);
  for(let i=1;i<keys.length;i++){
    if(t <= keys[i][0]){
      const a = keys[i-1], b = keys[i], k = ease(seg(t, a[0], b[0]));
      return [lerp(a[1],b[1],k), lerp(a[2],b[2],k), lerp(a[3],b[3],k)];
    }
  }
  return keys[keys.length-1].slice(1);
}

/* ══════════════ ASOSIY: t soniyaga mos kadr ══════════════ */
window.SEEK = function(t){
  const B = beats(), L = B.L;
  const FLOOR = 880;
  const talk = i => t >= L[i][0] && t <= L[i][1];

  /* ── chiroq tebranadi ── */
  T($('lamp'), `translate(1060,0) rotate(${(Math.sin(t*1.4)*3).toFixed(2)})`);
  $('sun').setAttribute('cy', (380 + t*0.6).toFixed(1));

  /* ════ OTA ════ */
  const DX = 1010;
  let lean = 0, hop = 0;
  if(talk(2)) lean = -7 * ease(seg(t, L[2][0]-0.4, L[2][0]));          /* telefonga engashadi */
  if(t >= L[4][0]-0.3 && t <= L[4][1]) hop = Math.abs(Math.sin((t-L[4][0]+0.3)*6.5))*22*(1-seg(t, L[4][1]-0.6, L[4][1]));
  const breathe = Math.sin(t*2.1)*2;
  T($('dad'), `translate(${DX},${(FLOOR - hop).toFixed(1)}) rotate(${lean.toFixed(2)},0,-200)`);
  T($('dadBody'), `translate(0,${(-190 + breathe*0.3).toFixed(2)}) scale(1,${(1+breathe*0.004).toFixed(4)})`);

  let headRot = Math.sin(t*0.9)*2, headY = -372;
  if(talk(0)) headRot = Math.sin(t*3.2)*7;                                /* bosh chayqaydi */
  T($('dadHead'), `translate(0,${headY}) rotate(${headRot.toFixed(2)})`);

  /* qo'llar: R — daftar tomondagi (o'ng), L — chap */
  let lA1 = 12, lA2 = 8, rA1 = -12, rA2 = -8;
  const flipping = t < L[0][1] + 0.4;
  if(flipping){
    const f = Math.sin(t*9);                                              /* varaq aylantiradi */
    rA1 = -38 - f*12; rA2 = -6 + f*10;
    lA1 = 150 - Math.sin(t*14)*5; lA2 = 72 - Math.sin(t*16)*12;           /* boshini qashiydi */
    const settle = ease(seg(t, L[0][1] - 0.2, L[0][1] + 0.4));
    lA1 = lerp(lA1, 12, settle); lA2 = lerp(lA2, 8, settle);
    rA1 = lerp(rA1, -12, settle); rA2 = lerp(rA2, -8, settle);
  }
  if(talk(2)){                                                             /* telefon tomonga imo qiladi */
    const w = Math.sin((t-L[2][0])*5);
    lA1 = 58 + w*10; lA2 = -36 - w*12;
  }
  /* eski daftarni oladi → boshi ustiga ko'taradi → chelak tomonga otadi */
  const THROW = [-105, -12];
  if(t >= B.grab[0] && t < B.fly[1] + 0.6){
    const g  = ease(seg(t, B.grab[0], B.grab[1]));
    const l  = ease(seg(t, B.lift[0], B.lift[1]));
    const th = easeOut(seg(t, B.fly[0], B.fly[0] + 0.3));
    const back = ease(seg(t, B.fly[0] + 0.4, B.fly[1] + 0.6));
    rA1 = lerp(-12, -40, g);  rA2 = lerp(-8, -6, g);
    rA1 = lerp(rA1, -168, l); rA2 = lerp(rA2, 12, l);
    rA1 = lerp(rA1, THROW[0], th); rA2 = lerp(rA2, THROW[1], th);
    rA1 = lerp(rA1, -12, back); rA2 = lerp(rA2, -8, back);
  }
  if(t >= L[4][0] - 0.3 && t <= L[4][1] + 0.4){                            /* xursandchilik */
    const j = ease(seg(t, L[4][0]-0.3, L[4][0]+0.2)) * (1 - ease(seg(t, L[4][1]-0.1, L[4][1]+0.4)));
    const w = Math.sin((t-L[4][0])*8);
    lA1 = lerp(lA1, 150 + w*10, j); lA2 = lerp(lA2, 20, j);
    rA1 = lerp(rA1, -150 - w*10, j); rA2 = lerp(rA2, -20, j);
  }
  poseLimb($('dadArmL'), $('dadElbowL'), -62, -312, lA1, lA2, 74);
  poseLimb($('dadArmR'), $('dadElbowR'),  62, -312, rA1, rA2, 74);

  const dadTalking = talk(0) || talk(2) || talk(4);
  mouthTalk($('dadMouth'), $('dadSmile'), dadTalking, t, 25, 11);
  blink($('dadEyeL'), $('dadEyeR'), t, 0.4);
  const frown = t < B.phoneIn[0] ? 1 - seg(t, L[1][0], L[1][1]) : 0;      /* qovog'i ochiladi */
  const joy = talk(4) ? -6 : 0;
  T($('dadBrowL'), `translate(0,${joy}) rotate(${(frown*14).toFixed(1)},-22,-26)`);
  T($('dadBrowR'), `translate(0,${joy}) rotate(${(-frown*14).toFixed(1)},22,-26)`);

  /* ── daftar varag'i ── */
  const fp = flipping && t < L[0][1] - 0.2 ? Math.cos(t*4.5*Math.PI) : 1;
  T($('flipPage'), `scale(${fp.toFixed(3)},1)`);
  $('flipPage').setAttribute('opacity', flipping ? 1 : 0);

  /* yopiq daftar qo'lda → havoda → chelakda */
  const BIN = [1660, FLOOR];
  T($('bin'), `translate(${BIN[0]},${BIN[1]}) rotate(${(Math.sin((t-B.fly[1])*18)*6*(t>B.fly[1]?Math.exp(-(t-B.fly[1])*3.5):0)).toFixed(2)},0,0)`);
  const shR = [DX + 62, FLOOR - hop - 312];
  const [hx, hy] = limbTip(shR[0], shR[1], rA1, rA2, 74, 74);
  const bookOpen = t < B.grab[1];
  $('book').setAttribute('opacity', bookOpen ? 1 : 0);
  let bcx = hx, bcy = hy, brot = rA1 + rA2 + 180, bop = 0;
  if(!bookOpen){
    bop = 1;
    if(t >= B.fly[0] + 0.3){                    /* qo'l to'liq cho'zilganda qo'yib yuboradi */
      const k = seg(t, B.fly[0] + 0.3, B.fly[1]);
      const rel = limbTip(shR[0], FLOOR - 312, THROW[0], THROW[1], 74, 74);
      bcx = lerp(rel[0], BIN[0], k);
      bcy = lerp(rel[1], BIN[1] - 150, k) - Math.sin(k*Math.PI)*260;
      brot = THROW[0] + THROW[1] + 180 + k*560;
      if(k >= 1) bop = 0;
    }
  }
  $('bookClosed').setAttribute('opacity', bop);
  T($('bookClosed'), `translate(${bcx.toFixed(1)},${bcy.toFixed(1)}) rotate(${brot.toFixed(1)})`);

  const pk = seg(t, B.fly[1], B.fly[1] + 0.8);
  $('puff').setAttribute('opacity', pk > 0 && pk < 1 ? (1-pk).toFixed(3) : 0);
  PUFFS.forEach((p,i) => {
    const a = -Math.PI*(0.15 + 0.7*i/(PUFFS.length-1));
    p.setAttribute('cx', (BIN[0] + Math.cos(a)*(30 + pk*90)).toFixed(1));
    p.setAttribute('cy', (BIN[1] - 160 + Math.sin(a)*(20 + pk*70)).toFixed(1));
  });

  /* ── uchib yurgan varaqlar ── */
  PAPERS.forEach((p,i) => {
    const t0 = 1.0 + i*0.55, t1 = t0 + 2.4;
    if(t < t0){ p.setAttribute('opacity', 0); return; }
    const k = seg(t, t0, t1);
    const x0 = 1150 + (i%2?40:-40), y0 = 680;
    const onCounter = i%3 === 0;
    const xr = onCounter ? 800 + i*55 : 640 + ((i*173)%820);
    const yr = onCounter ? 690 : 1030 + (i%3)*12;
    const x = lerp(x0, xr, k) + Math.sin(k*Math.PI*3 + i)*40*(1-k);
    const y = lerp(y0, yr, ease(k)) - Math.sin(k*Math.PI)*(260 + (i%4)*50);
    const rot = k < 1 ? Math.sin(t*4 + i)*35*(1-k) + i*13 : i*13 % 40 - 20;
    p.setAttribute('opacity', 1);
    T(p, `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${onCounter?0.8:1},${k>=1?0.55:1})`);
  });

  /* savol belgisi */
  const qk = seg(t, L[0][0]+0.3, L[0][0]+0.7) - seg(t, L[0][1]-0.4, L[0][1]);
  $('qmark').setAttribute('opacity', clamp(qk,0,1).toFixed(3));
  T($('qmark'), `translate(${DX + 120},${(FLOOR - 470 + Math.sin(t*6)*8).toFixed(1)}) rotate(${(Math.sin(t*5)*10).toFixed(1)}) scale(${(0.5+0.5*easeOut(clamp(qk,0,1))).toFixed(3)})`);

  /* ════ MADINA ════ */
  const MX = 600;
  let mx, walking = false;
  if(t < B.walk[0]) mx = -160;
  else if(t <= B.walk[1]){ mx = lerp(-160, MX, ease(seg(t, B.walk[0], B.walk[1]))); walking = true; }
  else mx = MX;
  const ph = mx * 0.062;
  const stepA = walking ? Math.sin(ph) : 0;
  const bob = walking ? Math.abs(Math.sin(ph))*6 : 0;
  const mHop = (t >= L[4][0] && t <= L[4][0] + 0.9) ? Math.abs(Math.sin((t-L[4][0])*7))*24 : 0;
  T($('mad'), `translate(${mx.toFixed(1)},${(FLOOR - bob - mHop).toFixed(1)})`);

  const mKneeF = walking ? Math.max(0,-Math.sin(ph+0.7))*44 : 3;
  const mKneeB = walking ? Math.max(0,-Math.sin(ph+0.7+Math.PI))*44 : 0;
  poseLimb($('madLegF'), $('madKneeF'), 0, -176, walking ?  stepA*26 :  6, mKneeF, 88);
  poseLimb($('madLegB'), $('madKneeB'), 0, -176, walking ? -stepA*26 : -8, mKneeB, 88);
  T($('madBody'), `translate(0,-176)`);
  const mHeadRot = walking ? stepA*2 : Math.sin(t*1.2)*2 + (talk(1)||talk(3) ? Math.sin(t*4)*3 : 0);
  T($('madHead'), `translate(0,-338) rotate(${mHeadRot.toFixed(2)})`);
  T($('madBraid'), `translate(-34,-350) rotate(${(8 + (walking ? -stepA*8 : Math.sin(t*1.6)*3)).toFixed(2)})`);

  /* oldingi qo'l telefonni ushlaydi, orqadagisi bilan imo qiladi */
  let fA1 = -stepA*26 - 18, fA2 = -60, bA1 = stepA*26, bA2 = 14;
  if(!walking){ fA1 = -28; fA2 = -70; bA1 = 10; bA2 = 16; }
  const show = ease(seg(t, L[1][0] + 0.8, L[1][0] + 1.6)) * (1 - ease(seg(t, B.phoneOut[0], B.phoneOut[1])));
  fA1 = lerp(fA1, -78, show); fA2 = lerp(fA2, -16, show);
  if(talk(1) || talk(3)){
    const s = talk(1) ? L[1][0] : L[3][0];
    const w = Math.sin((t-s)*5.2);
    bA1 = -95 + w*20; bA2 = -30 - w*14;
  }
  if(t >= L[4][0] && t <= L[4][1]){                                       /* chapak */
    const c = Math.abs(Math.sin((t-L[4][0])*9));
    bA1 = -70 + c*14; bA2 = -40;
  }
  poseLimb($('madArmF'), $('madElbowF'), 0, -290, fA1, fA2, 66);
  poseLimb($('madArmB'), $('madElbowB'), 0, -290, bA1, bA2, 66);
  mouthTalk($('madMouth'), $('madSmile'), talk(1) || talk(3), t, 27, 9);
  blink($('madEyeL'), $('madEyeR'), t, 1.9);

  const [px, py] = limbTip(mx, FLOOR - bob - mHop - 290, fA1, fA2, 66, 68);
  T($('handPhone'), `translate(${px.toFixed(1)},${py.toFixed(1)}) rotate(${(lerp(-10, 8, show)).toFixed(1)}) scale(${(1 + show*0.15).toFixed(3)})`);
  $('handGlow').setAttribute('opacity', (show*(0.55 + 0.25*Math.sin(t*5))).toFixed(3));

  /* ota telefonga gapirganda ovoz to'lqinlari */
  const vk = talk(2) ? 1 : 0;
  $('voiceWaves').setAttribute('opacity', vk);
  if(vk){                                     /* og'izdan telefon tomonga */
    const mouthY = FLOOR - 372 + 38;
    ['vw1','vw2','vw3'].forEach((id,i) => {
      const k = ((t*1.8 + i/3) % 1);
      const r = 18 + k*36;
      const cx = DX - 70 - k*150;
      $(id).setAttribute('d', `M${cx.toFixed(1)},${(mouthY - r).toFixed(1)} q${(-r*0.8).toFixed(1)},${r.toFixed(1)} 0,${(2*r).toFixed(1)}`);
      $(id).setAttribute('opacity', (1-k).toFixed(3));
    });
  }

  /* ── eshik ── */
  const dk = seg(t, B.walk[0] - 0.3, B.walk[0] + 0.6) - seg(t, B.walk[0] + 1.6, B.walk[0] + 2.4);
  T($('doorPanel'), `translate(${(-clamp(dk,0,1)*120).toFixed(1)},0) scale(${(1-clamp(dk,0,1)*0.45).toFixed(3)},1)`);

  /* ── kamera ── */
  const [ccx, ccy, cs] = camAt(t, camKeys(B));
  T($('cam'), `translate(${(960 - ccx*cs).toFixed(1)},${(540 - ccy*cs).toFixed(1)}) scale(${cs.toFixed(4)})`);

  /* ── gap puffaklari ── */
  TL.bubbles.forEach((b, i) => {
    const el = $('bub'+i); if(!el) return;
    const k = clamp(seg(t, L[i][0]-0.25, L[i][0]+0.2) - seg(t, L[i][1]-0.1, L[i][1]+0.35), 0, 1);
    el.setAttribute('opacity', k.toFixed(3));
    const [x, y, w] = BUB_POS[i];
    T(el, `translate(${x + w/2},${y + 75}) scale(${(0.85 + 0.15*easeOut(k)).toFixed(3)}) translate(${-w/2},-75)`);
  });

  /* ════ TELEFON INTERFEYSI ════ */
  const pin = ease(seg(t, B.phoneIn[0], B.phoneIn[1])) * (1 - ease(seg(t, B.phoneOut[0], B.phoneOut[1])));
  $('phoneUI').setAttribute('opacity', clamp(pin*1.4, 0, 1).toFixed(3));
  T($('phoneUI'), `translate(${((1-pin)*620).toFixed(1)},0)`);
  $('dim').setAttribute('opacity', (pin*0.22).toFixed(3));

  /* gapirayotganda: mikrofon qizil, to'lqin, matn so'zma-so'z chiqadi */
  const rec = t >= L[2][0] - 0.2 && t <= B.send;
  $('micBtn').setAttribute('fill', rec ? '#ef4444' : '#2563eb');
  $('micPulse').setAttribute('opacity', rec ? (0.25 + 0.25*Math.sin(t*10)).toFixed(3) : 0);
  $('micPulse').setAttribute('r', rec ? (32 + 6*Math.abs(Math.sin(t*5))).toFixed(1) : 30);
  const tk = seg(t, L[2][0] + 0.1, L[2][1] - 0.1);
  const typed = (t > L[2][0] && t < B.send) ? TL.transcript.slice(0, Math.ceil(TL.transcript.length * tk)) : '';
  const shown = typed.length > 30 ? '…' + typed.slice(-29) : typed;
  $('transcript').textContent = shown;
  $('placeholder').setAttribute('opacity', rec || typed ? 0 : 1);
  WBARS.forEach((b,i) => {
    const on = rec && !typed;
    const h = on ? 8 + Math.abs(Math.sin(t*11 + i*0.9))*30 : 0;
    b.setAttribute('height', h.toFixed(1)); b.setAttribute('y', (954 - h/2).toFixed(1));
  });

  const sent = seg(t, B.send, B.send + 0.3);
  $('userMsg').setAttribute('opacity', sent.toFixed(3));
  T($('userMsg'), `translate(${((1-easeOut(sent))*40).toFixed(1)},${((1-easeOut(sent))*30).toFixed(1)})`);
  $('welcome').setAttribute('opacity', (1 - sent*0.5).toFixed(3));

  const typingOn = t >= B.typing[0] && t < B.typing[1];
  $('typingDots').setAttribute('opacity', typingOn ? 1 : 0);
  DOTS.forEach((d,i) => d.setAttribute('cy', (594 - (typingOn ? Math.max(0, Math.sin(t*10 - i*0.9))*10 : 0)).toFixed(1)));

  const rk = seg(t, B.reply, B.reply + 0.35);
  $('reply').setAttribute('opacity', rk.toFixed(3));
  T($('reply'), `translate(0,${((1-easeOut(rk))*24).toFixed(1)})`);

  /* raqamlar aylanadi: kassadan qarz chiqdi, qarzdorlarga qo'shildi */
  const ck = easeOut(seg(t, B.count[0], B.count[1]));
  $('vKassa').textContent = fmt(lerp(TL.kassa0, TL.kassa0 - TL.amount, ck));
  $('vQarz').textContent  = fmt(lerp(0, TL.amount, ck));
  $('vFoyda').textContent = fmt(TL.foyda);
  const flash = ck > 0 && ck < 1 ? 1 : 0;
  $('vKassa').setAttribute('fill', flash ? '#fca5a5' : '#f8fafc');
  $('vQarz').setAttribute('fill', flash ? '#facc15' : '#f8fafc');

  /* Madina sanab o'tadi: kassa → qarzdorlar → foyda */
  if(talk(3)){
    const q = seg(t, L[3][0], L[3][1]);
    const idx = q < 0.3 ? 0 : q < 0.6 ? 1 : 2;
    $('hiRing').setAttribute('x', 1196 + idx*166);
    $('hiRing').setAttribute('opacity', (0.6 + 0.4*Math.sin(t*8)).toFixed(3));
  } else $('hiRing').setAttribute('opacity', 0);

  /* ════ YAKUN ════ */
  const ok = ease(seg(t, B.outro, B.outro + 0.7));
  $('outro').setAttribute('opacity', ok.toFixed(3));
  T($('outroLogo'), `translate(0,${((1-ok)*40).toFixed(1)})`);
  const chk = seg(t, B.outro + 0.9, B.outro + 1.8);
  $('outroChips').setAttribute('opacity', chk.toFixed(3));
  T($('outroChips'), `translate(0,${((1-easeOut(chk))*30).toFixed(1)})`);

  SPARKS.forEach((s,i) => {
    const st = B.outro + 0.3 + (i%15)*0.05;
    const k = seg(t, st, st + 1.7);
    if(k <= 0 || k >= 1 || ok < 0.2){ s.setAttribute('opacity', 0); return; }
    const ang = (i/SPARKS.length)*Math.PI*2 + (i%3);
    const rad = 80 + k*460;
    s.setAttribute('cx', (960 + Math.cos(ang)*rad*1.3).toFixed(1));
    s.setAttribute('cy', (420 + Math.sin(ang)*rad*0.7).toFixed(1));
    s.setAttribute('opacity', ((1-k)*0.9).toFixed(3));
  });
};

SEEK(0);
</script>
