<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>MUHASIB — Whiteboard Doodle Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #fbfbfe;
      font-family: 'Kalam', 'Caveat', cursive, sans-serif;
      position: relative;
      user-select: none;
    }

    /* Whiteboard grid texture background */
    .board-bg {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(#cbd5e1 1.2px, transparent 1.2px),
        radial-gradient(#cbd5e1 1.2px, #fbfbfe 1.2px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      opacity: 0.65;
    }

    /* Main SVG Drawing Canvas */
    svg.canvas {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      z-index: 10;
    }

    /* Sketch Path Defaults */
    .draw-stroke {
      fill: none;
      stroke: #1e293b;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .draw-blue {
      fill: none;
      stroke: #2563eb;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .draw-red {
      fill: none;
      stroke: #dc2626;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .draw-green {
      fill: none;
      stroke: #16a34a;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .draw-gold {
      fill: none;
      stroke: #d97706;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Text elements drawn dynamically */
    .wb-title {
      font-family: 'Kalam', cursive;
      font-size: 58px;
      font-weight: 700;
      fill: #1e3a8a;
    }
    .wb-subtitle {
      font-family: 'Kalam', cursive;
      font-size: 38px;
      font-weight: 700;
      fill: #1e293b;
    }
    .wb-text-red {
      font-family: 'Kalam', cursive;
      font-size: 36px;
      font-weight: 700;
      fill: #dc2626;
    }
    .wb-text-green {
      font-family: 'Kalam', cursive;
      font-size: 36px;
      font-weight: 700;
      fill: #15803d;
    }

    /* Fill shapes that expand */
    .fill-shape {
      transition: opacity 0.2s ease;
    }

    /* Hand & Pen Marker layer */
    #hand-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
      z-index: 1000;
      transform: translate(1920px, 1080px);
    }
  </style>
</head>
<body>

  <svg class="canvas" viewBox="0 0 1920 1080">

  <!-- ================= HAND WITH MARKER PEN (SVG LAYER) ================= -->
  <div id="hand-container">

        <!-- Pen Nib / Tip pointing at (0,0) -->

        <!-- Hand Fingers & Sleeve -->

        <!-- Index Finger extending -->

      </g>
    </svg>

  <script>
    // ================= CONTRACT & SETUP =================
    window.DURATION = 24.0;

    // Helper: Clamped segment 0..1
    function seg(t, t0, t1) {
      if (t <= t0) return 0;
      if (t >= t1) return 1;
      return (t - t0) / (t1 - t0);
    }

    // Ease function
    function easeInOut(p) {
      return p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
    }

    // List of path elements to prepare for stroke-dasharray animation
    const pathElements = [];
    document.querySelectorAll('path[id]').forEach(path => {
      try {
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
        pathElements.push({ id: path.id, el: path, len: len });
      } catch(e) {}
    });

    function drawStroke(id, progress) {
      const item = pathElements.find(p => p.id === id);
      if (!item) return { x: 960, y: 540 };
      const pClamped = Math.max(0, Math.min(1, progress));
      item.el.style.strokeDashoffset = item.len * (1 - pClamped);
      
      // Get point for hand tracking
      try {
        const pt = item.el.getPointAtLength(item.len * pClamped);
        return { x: pt.x, y: pt.y };
      } catch(e) {
        return { x: 960, y: 540 };
      }
    }

    function writeText(id, fullStr, progress, xStart, yStart, xEnd) {
      const el = document.getElementById(id);
      if (!el) return { x: xStart, y: yStart };
      const pClamped = Math.max(0, Math.min(1, progress));
      const chars = Math.floor(fullStr.length * pClamped);
      el.textContent = fullStr.substring(0, chars);
      
      const currentX = xStart + (xEnd - xStart) * pClamped;
      return { x: currentX, y: yStart };
    }

    const handContainer = document.getElementById('hand-container');
    function setHandPos(x, y, opacity = 1) {
      handContainer.style.transform = `translate(${x}px, ${y}px)`;
      handContainer.style.opacity = opacity;
    }

    // DOM Scene Elements
    const scene1 = document.getElementById('scene-1');
    const scene2 = document.getElementById('scene-2');
    const scene3 = document.getElementById('scene-3');
    const scene4 = document.getElementById('scene-4');

    // ================= SEEK FUNCTION (Deterministic Frame-by-Frame) =================
    window.SEEK = function(t) {
      let handPt = { x: 1700, y: 900, active: false };

      // ---------------- SCENE 1 (0.0s - 5.5s) ----------------
      if (t < 5.5) {
        scene1.style.opacity = 1;
        scene2.style.opacity = 0;
        scene3.style.opacity = 0;
        scene4.style.opacity = 0;

        // Step 1.1: Draw Title Box & Text (0.2s - 1.2s)
        if (t >= 0.2 && t < 1.2) {
          const p = seg(t, 0.2, 0.8);
          handPt = drawStroke('s1-title-box', p);
          writeText('s1-title-text', "KASSADAGI MUAMMO?", seg(t, 0.5, 1.2), 650, 112, 1250);
          if (t >= 0.5) handPt = writeText('s1-title-text', "KASSADAGI MUAMMO?", seg(t, 0.5, 1.2), 650, 112, 1250);
        } else if (t >= 1.2) {
          drawStroke('s1-title-box', 1);
          writeText('s1-title-text', "KASSADAGI MUAMMO?", 1, 650, 112, 1250);
        }

        // Step 1.2: Draw Cashier & Table (1.2s - 2.8s)
        if (t >= 1.2 && t < 2.8) {
          drawStroke('s1-c-head', seg(t, 1.2, 1.5));
          drawStroke('s1-c-eyes', seg(t, 1.5, 1.7));
          drawStroke('s1-c-mouth', seg(t, 1.7, 1.9));
          drawStroke('s1-c-sweat', seg(t, 1.9, 2.1));
          drawStroke('s1-c-body', seg(t, 2.1, 2.4));
          drawStroke('s1-table', seg(t, 2.4, 2.6));
          drawStroke('s1-notebook', seg(t, 2.5, 2.7));
          handPt = drawStroke('s1-calc', seg(t, 2.6, 2.8));
        } else if (t >= 2.8) {
          ['s1-c-head', 's1-c-eyes', 's1-c-mouth', 's1-c-sweat', 's1-c-body', 's1-table', 's1-notebook', 's1-calc'].forEach(id => drawStroke(id, 1));
        }

        // Step 1.3: Draw Queue & Clock (2.8s - 4.0s)
        if (t >= 2.8 && t < 4.0) {
          drawStroke('s1-q1-head', seg(t, 2.8, 3.0));
          drawStroke('s1-q1-body', seg(t, 3.0, 3.2));
          drawStroke('s1-q2-head', seg(t, 3.2, 3.4));
          drawStroke('s1-q2-body', seg(t, 3.4, 3.6));
          drawStroke('s1-clock', seg(t, 3.6, 3.8));
          handPt = drawStroke('s1-clock-arrow', seg(t, 3.8, 4.0));
        } else if (t >= 4.0) {
          ['s1-q1-head', 's1-q1-body', 's1-q2-head', 's1-q2-body', 's1-clock', 's1-clock-arrow'].forEach(id => drawStroke(id, 1));
        }

        // Step 1.4: Draw Red Cross & Warning Text (4.0s - 5.5s)
        if (t >= 4.0 && t < 5.5) {
          drawStroke('s1-cross-1', seg(t, 4.0, 4.4));
          handPt = drawStroke('s1-cross-2', seg(t, 4.4, 4.8));
          writeText('s1-subtext-1', "❌ Uzun navbatlar, dasta-dasta daftarlar...", seg(t, 4.5, 5.0), 250, 670, 1100);
          handPt = writeText('s1-subtext-2', "❌ Soliq va tushumda muntazam xatoliklar!", seg(t, 5.0, 5.5), 250, 720, 1100);
        } else if (t >= 5.5) {
          drawStroke('s1-cross-1', 1); drawStroke('s1-cross-2', 1);
          writeText('s1-subtext-1', "❌ Uzun navbatlar, dasta-dasta daftarlar...", 1, 250, 670, 1100);
          writeText('s1-subtext-2', "❌ Soliq va tushumda muntazam xatoliklar!", 1, 250, 720, 1100);
        }
      }

      // ---------------- SCENE 2 (5.5s - 12.5s) ----------------
      else if (t >= 5.5 && t < 12.5) {
        scene1.style.opacity = Math.max(0, 1 - seg(t, 5.5, 6.0));
        scene2.style.opacity = seg(t, 5.5, 6.0);
        scene3.style.opacity = 0;
        scene4.style.opacity = 0;

        // Step 2.1: Draw Outer Box & Banner (5.8s - 7.2s)
        if (t >= 5.8 && t < 7.2) {
          drawStroke('s2-box', seg(t, 5.8, 6.5));
          drawStroke('s2-banner', seg(t, 6.3, 6.8));
          handPt = writeText('s2-banner-text', "YECHIM: SALAM POS KASSA", seg(t, 6.6, 7.2), 650, 138, 1280);
        } else if (t >= 7.2) {
          drawStroke('s2-box', 1); drawStroke('s2-banner', 1);
          writeText('s2-banner-text', "YECHIM: SALAM POS KASSA", 1, 650, 138, 1280);
        }

        // Step 2.2: Draw Terminal, Frame & Real Photo (7.2s - 9.5s)
        const imgWrap = document.getElementById('s2-real-img-wrap');
        if (t >= 7.2 && t < 9.5) {
          drawStroke('s2-t-base', seg(t, 7.2, 7.6));
          handPt = drawStroke('s2-t-screen', seg(t, 7.6, 8.8));
          if (imgWrap) imgWrap.style.opacity = seg(t, 8.0, 8.8);
          handPt = drawStroke('s2-t-ui3', seg(t, 8.8, 9.5));
        } else if (t >= 9.5) {
          ['s2-t-base', 's2-t-screen', 's2-t-ui3'].forEach(id => drawStroke(id, 1));
          if (imgWrap) imgWrap.style.opacity = 1;
        }

        // Step 2.3: Scanner & Receipt Printer (9.5s - 11.2s)
        if (t >= 9.5 && t < 11.2) {
          drawStroke('s2-sc-gun', seg(t, 9.5, 9.9));
          drawStroke('s2-sc-laser', seg(t, 9.9, 10.2));
          drawStroke('s2-pr-box', seg(t, 10.2, 10.5));
          drawStroke('s2-pr-paper', seg(t, 10.5, 10.8));
          drawStroke('s2-pr-lines', seg(t, 10.8, 11.0));
          handPt = drawStroke('s2-pr-check', seg(t, 11.0, 11.2));
        } else if (t >= 11.2) {
          ['s2-sc-gun', 's2-sc-laser', 's2-pr-box', 's2-pr-paper', 's2-pr-lines', 's2-pr-check'].forEach(id => drawStroke(id, 1));
        }

        // Step 2.4: Logo Shield & Subtitle Text (11.2s - 12.5s)
        if (t >= 11.2 && t < 12.5) {
          drawStroke('s2-logo-shield', seg(t, 11.2, 11.6));
          drawStroke('s2-logo-crown', seg(t, 11.6, 11.9));
          handPt = writeText('s2-subtext', "✨ Savdoni 100% avtomatlashtiruvchi aqlli dastur!", seg(t, 11.8, 12.5), 380, 660, 1500);
        } else if (t >= 12.5) {
          drawStroke('s2-logo-shield', 1); drawStroke('s2-logo-crown', 1);
          writeText('s2-subtext', "✨ Savdoni 100% avtomatlashtiruvchi aqlli dastur!", 1, 380, 660, 1500);
        }
      }

      // ---------------- SCENE 3 (12.5s - 19.5s) ----------------
      else if (t >= 12.5 && t < 19.5) {
        scene1.style.opacity = 0;
        scene2.style.opacity = Math.max(0, 1 - seg(t, 12.5, 13.0));
        scene3.style.opacity = seg(t, 12.5, 13.0);
        scene4.style.opacity = 0;

        // Title Line & Text
        if (t >= 12.6 && t < 13.5) {
          drawStroke('s3-title-line', seg(t, 12.6, 13.0));
          handPt = writeText('s3-title-text', "SALAM POS KASSANING 4 AFZALLIGI", seg(t, 12.8, 13.5), 540, 55, 1380);
        } else if (t >= 13.5) {
          drawStroke('s3-title-line', 1);
          writeText('s3-title-text', "SALAM POS KASSANING 4 AFZALLIGI", 1, 540, 55, 1380);
        }

        // Card 1: 1-Soniyada Skanerlash (13.5s - 15.0s)
        if (t >= 13.5 && t < 15.0) {
          drawStroke('s3-c1-box', seg(t, 13.5, 13.8));
          drawStroke('s3-c1-icon', seg(t, 13.8, 14.1));
          drawStroke('s3-c1-check', seg(t, 14.1, 14.3));
          writeText('s3-c1-t1', "⚡ 1-Soniyada Skanerlash", seg(t, 14.0, 14.4), 300, 220, 750);
          writeText('s3-c1-t2', "• Shtrix-kod bilan tovarlarni", seg(t, 14.3, 14.7), 180, 320, 650);
          writeText('s3-c1-t3', "  lahzada kassa chekiga urish", seg(t, 14.5, 14.9), 180, 370, 650);
          handPt = writeText('s3-c1-t4', "✅ Navbatlar 3 baravar qisqaradi!", seg(t, 14.7, 15.0), 180, 440, 750);
        } else if (t >= 15.0) {
          ['s3-c1-box', 's3-c1-icon', 's3-c1-check'].forEach(id => drawStroke(id, 1));
          writeText('s3-c1-t1', "⚡ 1-Soniyada Skanerlash", 1, 300, 220, 750);
          writeText('s3-c1-t2', "• Shtrix-kod bilan tovarlarni", 1, 180, 320, 650);
          writeText('s3-c1-t3', "  lahzada kassa chekiga urish", 1, 180, 370, 650);
          writeText('s3-c1-t4', "✅ Navbatlar 3 baravar qisqaradi!", 1, 180, 440, 750);
        }

        // Card 2: Ombor Nazorati (15.0s - 16.5s)
        if (t >= 15.0 && t < 16.5) {
          drawStroke('s3-c2-box', seg(t, 15.0, 15.3));
          drawStroke('s3-c2-icon', seg(t, 15.3, 15.6));
          drawStroke('s3-c2-check', seg(t, 15.6, 15.8));
          writeText('s3-c2-t1', "📦 Ombor Nazorati", seg(t, 15.5, 15.9), 1220, 220, 1600);
          writeText('s3-c2-t2', "• Qolgan mahsulotlar soni va", seg(t, 15.8, 16.2), 1050, 320, 1550);
          writeText('s3-c2-t3', "  muddati haqida avto-ogohlantirish", seg(t, 16.0, 16.4), 1050, 370, 1650);
          handPt = writeText('s3-c2-t4', "✅ Kamomat va yo'qotishlarga barham!", seg(t, 16.2, 16.5), 1050, 440, 1700);
        } else if (t >= 16.5) {
          ['s3-c2-box', 's3-c2-icon', 's3-c2-check'].forEach(id => drawStroke(id, 1));
          writeText('s3-c2-t1', "📦 Ombor Nazorati", 1, 1220, 220, 1600);
          writeText('s3-c2-t2', "• Qolgan mahsulotlar soni va", 1, 1050, 320, 1550);
          writeText('s3-c2-t3', "  muddati haqida avto-ogohlantirish", 1, 1050, 370, 1650);
          writeText('s3-c2-t4', "✅ Kamomat va yo'qotishlarga barham!", 1, 1050, 440, 1700);
        }

        // Card 3: Aniq Moliya (16.5s - 18.0s)
        if (t >= 16.5 && t < 18.0) {
          drawStroke('s3-c3-box', seg(t, 16.5, 16.8));
          drawStroke('s3-c3-icon', seg(t, 16.8, 17.1));
          drawStroke('s3-c3-check', seg(t, 17.1, 17.3));
          writeText('s3-c3-t1', "📊 Aniq Foyda Tahlili", seg(t, 17.0, 17.4), 330, 620, 750);
          writeText('s3-c3-t2', "• Kunlik, haftalik va oylik", seg(t, 17.3, 17.7), 180, 780, 650);
          writeText('s3-c3-t3', "  sof daromad va harajatlar", seg(t, 17.5, 17.9), 180, 830, 650);
          handPt = writeText('s3-c3-t4', "✅ 100% Aniq moliya hisobi!", seg(t, 17.7, 18.0), 180, 910, 750);
        } else if (t >= 18.0) {
          ['s3-c3-box', 's3-c3-icon', 's3-c3-check'].forEach(id => drawStroke(id, 1));
          writeText('s3-c3-t1', "📊 Aniq Foyda Tahlili", 1, 330, 620, 750);
          writeText('s3-c3-t2', "• Kunlik, haftalik va oylik", 1, 180, 780, 650);
          writeText('s3-c3-t3', "  sof daromad va harajatlar", 1, 180, 830, 650);
          writeText('s3-c3-t4', "✅ 100% Aniq moliya hisobi!", 1, 180, 910, 750);
        }

        // Card 4: Masofaviy Telegram-Bot (18.0s - 19.5s)
        if (t >= 18.0 && t < 19.5) {
          drawStroke('s3-c4-box', seg(t, 18.0, 18.3));
          drawStroke('s3-c4-icon', seg(t, 18.3, 18.6));
          drawStroke('s3-c4-check', seg(t, 18.6, 18.8));
          writeText('s3-c4-t1', "📱 Telegram-Bot Nazorati", seg(t, 18.5, 18.9), 1160, 620, 1650);
          writeText('s3-c4-t2', "• Istalgan joydan savdoni", seg(t, 18.8, 19.2), 1050, 780, 1550);
          writeText('s3-c4-t3', "  telefoningizda kuzating", seg(t, 19.0, 19.4), 1050, 830, 1550);
          handPt = writeText('s3-c4-t4', "✅ Biznes kaftingizda!", seg(t, 19.2, 19.5), 1050, 910, 1600);
        } else if (t >= 19.5) {
          ['s3-c4-box', 's3-c4-icon', 's3-c4-check'].forEach(id => drawStroke(id, 1));
          writeText('s3-c4-t1', "📱 Telegram-Bot Nazorati", 1, 1160, 620, 1650);
          writeText('s3-c4-t2', "• Istalgan joydan savdoni", 1, 1050, 780, 1550);
          writeText('s3-c4-t3', "  telefoningizda kuzating", 1, 1050, 830, 1550);
          writeText('s3-c4-t4', "✅ Biznes kaftingizda!", 1, 1050, 910, 1600);
        }
      }

      // ---------------- SCENE 4 (19.5s - 24.0s) ----------------
      else if (t >= 19.5) {
        scene1.style.opacity = 0;
        scene2.style.opacity = 0;
        scene3.style.opacity = Math.max(0, 1 - seg(t, 19.5, 20.0));
        scene4.style.opacity = seg(t, 19.5, 20.0);

        // Badge & 2X Boost Text
        if (t >= 19.8 && t < 21.5) {
          drawStroke('s4-badge', seg(t, 19.8, 20.4));
          writeText('s4-badge-t1', "🚀 SAVDONGIZNI 2 BARAVAR OSHIRING!", seg(t, 20.2, 20.9), 380, 230, 1550);
          writeText('s4-badge-t2', "100% Aniq Hisob va Zamonaviy Kassa", seg(t, 20.8, 21.4), 420, 360, 1500);
          drawStroke('s4-star-1', seg(t, 21.0, 21.3));
          handPt = drawStroke('s4-star-2', seg(t, 21.2, 21.5));
        } else if (t >= 21.5) {
          drawStroke('s4-badge', 1); drawStroke('s4-star-1', 1); drawStroke('s4-star-2', 1);
          writeText('s4-badge-t1', "🚀 SAVDONGIZNI 2 BARAVAR OSHIRING!", 1, 380, 230, 1550);
          writeText('s4-badge-t2', "100% Aniq Hisob va Zamonaviy Kassa", 1, 420, 360, 1500);
        }

        // Contact Box & Details
        if (t >= 21.5 && t < 24.0) {
          drawStroke('s4-contact-box', seg(t, 21.5, 22.0));
          writeText('s4-logo-text', "SALAM POS & MUHASIB", seg(t, 21.9, 22.5), 620, 660, 1380);
          drawStroke('s4-phone-icon', seg(t, 22.3, 22.6));
          writeText('s4-phone-text', "+998 (90) 123-45-67", seg(t, 22.5, 23.0), 540, 810, 1000);
          drawStroke('s4-web-icon', seg(t, 22.8, 23.1));
          writeText('s4-web-text', "www.muhasib.uz", seg(t, 23.0, 23.5), 1220, 810, 1550);
          handPt = drawStroke('s4-final-check', seg(t, 23.2, 23.8));
        } else {
          ['s4-contact-box', 's4-phone-icon', 's4-web-icon', 's4-final-check'].forEach(id => drawStroke(id, 1));
          writeText('s4-logo-text', "SALAM POS & MUHASIB", 1, 620, 660, 1380);
          writeText('s4-phone-text', "+998 (90) 123-45-67", 1, 540, 810, 1000);
          writeText('s4-web-text', "www.muhasib.uz", 1, 1220, 810, 1550);
        }
      }

      // Position hand with marker pen
      if (handPt.x !== undefined && handPt.y !== undefined) {
        setHandPos(handPt.x, handPt.y, 1);
      } else {
        setHandPos(1800, 950, 0.5);
      }
    };
  </script>
