<script>
/* ══════════════════════════════════════════════════════════════════
   MUHASIB multfilmi — barcha harakat SEEK(t) ichida hisoblanadi.
   Brauzer soati ishlatilmaydi → render har safar bir xil chiqadi.
   ══════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp  = (a,b,t) => a + (b-a)*t;
const ease  = t => t<0 ? 0 : t>1 ? 1 : t*t*(3-2*t);
const easeOut = t => 1-Math.pow(1-clamp(t,0,1),3);
/* [t0,t1] oralig'idagi 0..1 progress */
const seg = (t,t0,t1) => clamp((t-t0)/Math.max(0.0001,t1-t0),0,1);
const T   = (g,tr) => g.setAttribute('transform',tr);

/* ── vaqt jadvali (render vaqtida window.CONFIG bilan almashtiriladi) ── */
let TL = {
  duration: 32,
  lines: [
    {who:'cash', start:12.2, dur:3.6},
    {who:'boy',  start:17.6, dur:4.4},
    {who:'boy',  start:24.0, dur:4.8}
  ],
  price: "25 000 so'm",
  cashText: ["Uka, energetik ichimligingiz", "25 000 so'm bo'ldi."],
  boyText:  ["Vay!", "Nega sizlarda MUHASIB", "dasturi yo'q?!"]
};
window.DURATION = TL.duration;

window.APPLY_CONFIG = function(){
  if(!window.CONFIG) return;
  TL = Object.assign(TL, window.CONFIG);
  window.DURATION = TL.duration;
  fillTexts();
};

function fillTexts(){
  $('bcT1').textContent = TL.cashText[0] || '';
  $('bcT2').textContent = TL.cashText[1] || '';
  $('bbT1').textContent = TL.boyText[0] || '';
  $('bbT2').textContent = TL.boyText[1] || '';
  $('bbT3').textContent = TL.boyText[2] || '';
  $('posPrice').textContent = TL.price;
}

/* ── bir marta chiziladigan bezaklar ── */
(function decor(){
  let s = '';
  for(let x=-400; x<2600; x+=160)
    s += `<path d="M${x},880 L${x+80},1080" stroke="#8aa0ba" stroke-width="3" fill="none"/>`;
  for(let y=920; y<1080; y+=52)
    s += `<line x1="-400" y1="${y}" x2="2600" y2="${y}" stroke="#8aa0ba" stroke-width="3"/>`;
  $('tiles').innerHTML = s;

  let c = '';                                   /* muzlatgichdagi bankalar */
  const rows = [320, 470, 620, 760];
  rows.forEach((y,ri) => {
    c += `<rect x="356" y="${y+64}" width="378" height="10" rx="5" fill="#b9cddd"/>`;
    for(let i=0;i<7;i++){
      const x = 380 + i*52, hidden = (ri===1 && i===3);
      c += `<g opacity="${hidden?0:1}" id="${hidden?'shelfGap':''}">
              <rect x="${x-14}" y="${y}" width="28" height="64" rx="6" fill="${ri%2?'#12a45c':'#1d63d8'}"/>
              <rect x="${x-14}" y="${y}" width="28" height="10" rx="5" fill="#cfd8dc"/>
            </g>`;
    }
  });
  $('shelfCans').innerHTML = c;

  let b = '';                                   /* orqa javondagi qutilar */
  for(let i=0;i<8;i++){
    const x = 900 + i*72, h = 60 + (i%3)*18;
    b += `<rect x="${x}" y="${330-h}" width="52" height="${h}" rx="6" fill="${['#f0b48d','#9fc6e8','#f6d365','#c8e6c9'][i%4]}"/>`;
    b += `<rect x="${x}" y="${520-h+10}" width="52" height="${h-10}" rx="6" fill="${['#e8a67d','#b0d4f1','#f7e08a','#b7ddb9'][i%4]}"/>`;
  }
  $('shelfBoxes').innerHTML = b;

  let sp = '';                                  /* yakundagi uchqunlar */
  for(let i=0;i<26;i++)
    sp += `<circle class="spark" cx="0" cy="0" r="${3+ (i%4)}" fill="${['#4285f4','#ea4335','#fbbc05','#34a853'][i%4]}" opacity="0"/>`;
  $('sparks').innerHTML = sp;
  fillTexts();
})();
const SPARKS = Array.from(document.querySelectorAll('.spark'));

/* ── personaj rigi ── */
function poseLeg(hip, knee, a1, a2, up){ T(hip,`translate(0,${up}) rotate(${a1})`); T(knee,`translate(0,96) rotate(${a2})`); }
function poseArm(sh, el, a1, a2, up){ T(sh,`translate(0,${up}) rotate(${a1})`); T(el,`translate(0,78) rotate(${a2})`); }

/* Qo'l uchining (kaftning) haqiqiy koordinatasi — banka aynan kaftda tursin.
   SVG rotate(θ): (0,L) → (-L·sinθ, L·cosθ) */
function armTip(sx, sy, a1, a2, l1, l2){
  const r1 = a1*Math.PI/180, r2 = a2*Math.PI/180;
  const ex = sx - l1*Math.sin(r1), ey = sy + l1*Math.cos(r1);
  const fx = -l2*Math.sin(r2),    fy = l2*Math.cos(r2);
  return [ ex + fx*Math.cos(r1) - fy*Math.sin(r1),
           ey + fx*Math.sin(r1) + fy*Math.cos(r1) ];
}

function mouthTalk(mouthEl, smileEl, on, t, speed){
  if(on){
    const o = 0.5 + 0.5*Math.sin(t*(speed||24));
    mouthEl.setAttribute('ry', (3 + o*11).toFixed(2));
    mouthEl.setAttribute('rx', (16 - o*4).toFixed(2));
    mouthEl.setAttribute('opacity', 1);
    smileEl.setAttribute('opacity', 0);
  } else {
    mouthEl.setAttribute('opacity', 0);
    smileEl.setAttribute('opacity', 1);
  }
}
function blink(eyeL, eyeR, t, phase){
  const p = ((t + (phase||0)) % 3.4);
  const k = p < 0.13 ? Math.abs(Math.cos(p/0.13*Math.PI/2)) : 1;
  const sy = clamp(k, 0.06, 1);
  T(eyeL, `translate(0,${(1-sy)*2}) scale(1,${sy})`);
  T(eyeR, `translate(0,${(1-sy)*2}) scale(1,${sy})`);
}

/* ── sahna vaqtlari ── */
function beats(){
  const L = TL.lines;
  return {
    walkIn:  [0.4, 3.6],          /* eshikdan kiradi */
    toFridge:[3.6, 6.2],          /* muzlatgich oldiga */
    grab:    [6.2, 8.4],          /* bankani oladi */
    toDesk:  [8.4, L[0].start-0.6],
    cashLine:[L[0].start, L[0].start + L[0].dur],
    boyLine: [L[1].start, L[1].start + L[1].dur],
    posIn:   [L[2].start - 1.2, L[2].start + 0.6],
    scan:    [L[2].start + 0.8, L[2].start + 2.2],
    outro:   [L[2].start + TL.lines[2].dur - 0.4, TL.duration]
  };
}

/* ══════════════ ASOSIY: t soniyaga mos kadrni chizadi ══════════════ */
window.SEEK = function(t){
  const B = beats();
  const FLOOR = 880;

  /* ── BOLA yo'li ── */
  let bx, walking = false;
  if(t < B.walkIn[0]){ bx = -180; }
  else if(t <= B.walkIn[1]){ bx = lerp(-180, 300, ease(seg(t,B.walkIn[0],B.walkIn[1]))); walking = true; }
  else if(t <= B.toFridge[1]){ bx = lerp(300, 640, ease(seg(t,B.toFridge[0],B.toFridge[1]))); walking = true; }
  else if(t <= B.grab[1]){ bx = 640; }
  else if(t <= B.toDesk[1]){ bx = lerp(640, 1130, ease(seg(t,B.toDesk[0],B.toDesk[1]))); walking = true; }
  else { bx = 1130; }

  /* qadam fazasi — bosilgan masofaga bog'liq (sirpanmaydi) */
  const phase = bx * 0.055;
  const stepA = walking ? Math.sin(phase) : 0;
  const bob   = walking ? Math.abs(Math.sin(phase))*7 : 0;

  /* hayajon sakrashi */
  const jump = (t>=B.boyLine[0]-0.25 && t<=B.boyLine[0]+0.85)
    ? Math.abs(Math.sin((t-(B.boyLine[0]-0.25))*7.5))*46*(1-seg(t,B.boyLine[0]+0.35,B.boyLine[0]+0.85)) : 0;

  T($('boy'), `translate(${bx.toFixed(1)},${(FLOOR - bob - jump).toFixed(1)})`);

  /* turganda oyoqlar ustma-ust tushmasligi uchun kichik stoyka beriladi */
  const kneeF = walking ? Math.max(0,-Math.sin(phase+0.7))*46 : 4;
  const kneeB = walking ? Math.max(0,-Math.sin(phase+0.7+Math.PI))*46 : 0;
  const hipF  = walking ?  stepA*26 :  7;
  const hipB  = walking ? -stepA*26 : -9;
  poseLeg($('boyLegF'), $('boyKneeF'), hipF, kneeF, -190);
  poseLeg($('boyLegB'), $('boyKneeB'), hipB, kneeB, -190);
  T($('boyBody'), `translate(0,-190)`);
  T($('boyHead'), `translate(0,-352) rotate(${(walking? stepA*2 : Math.sin(t*1.3)*1.5).toFixed(2)})`);

  /* qo'llar: yurishda tebranadi, olayotganda cho'ziladi, gapirganda ko'tariladi */
  let armF1 = -stepA*30, armF2 = 22, armB1 = stepA*30, armB2 = 22;
  const gp = seg(t, B.grab[0], B.grab[0]+1.0);            /* cho'zilish */
  const gb = seg(t, B.grab[0]+1.0, B.grab[1]);            /* qaytarish */
  if(t >= B.grab[0] && t <= B.grab[1]){
    /* muzlatgich chapda: qo'l yuqori-chapga cho'ziladi, so'ng ko'krakka qaytadi */
    armF1 = lerp(0, 140, ease(gp)) + lerp(0, -174, ease(gb));
    armF2 = lerp(20, -40, ease(gp)) + lerp(0, 100, ease(gb));
  } else if(t > B.grab[1]){
    armF1 = -34 + (walking ? -stepA*16 : 0); armF2 = 60;   /* bankani ushlab turadi */
  }
  if(t >= B.boyLine[0] && t <= B.boyLine[1]){
    const w = Math.sin((t-B.boyLine[0])*5.5);
    armB1 = -104 + w*22; armB2 = 34 - w*16;                /* qo'l silkitib gapiradi */
    armF1 = -40 + w*8;   armF2 = 62;
  }
  poseArm($('boyArmF'), $('boyElbowF'), armF1, armF2, -318);
  poseArm($('boyArmB'), $('boyElbowB'), armB1, armB2, -318);

  const boyTalking = (t >= B.boyLine[0] && t <= B.boyLine[1]);
  mouthTalk($('boyMouth'), $('boySmile'), boyTalking, t, 26);
  blink($('boyEyeL'), $('boyEyeR'), t, 0.0);
  const browUp = boyTalking ? -10 : 0;
  $('boyBrowL').setAttribute('y', -24 + browUp);
  $('boyBrowR').setAttribute('y', -24 + browUp);

  /* ── BANKA: javonda → qo'lda → prilavkada → skanerda ── */
  const canG = $('can');
  const gapCan = $('shelfGap');
  if(gapCan) gapCan.setAttribute('opacity', t >= B.grab[0]+0.55 ? 0 : 1);

  let cx, cy, crot = 0, cop = 0;
  const shY = FLOOR - bob - jump - 318;                    /* yelka nuqtasi */
  const [hX, hY] = armTip(bx, shY, armF1, armF2, 78, 80);  /* kaftning aniq joyi */
  const SHELF = [536, 502];                               /* javondagi bo'sh joy */
  if(t < B.grab[0]+0.55){ cop = 0; cx = SHELF[0]; cy = SHELF[1]; }
  else if(t <= B.grab[1]){
    const k = ease(seg(t, B.grab[0]+0.55, B.grab[1]));
    cop = 1;
    cx = lerp(SHELF[0], hX, k);
    cy = lerp(SHELF[1], hY, k);
    crot = lerp(0, -8, k);
  } else if(t < B.cashLine[0]+0.4){
    cop = 1; cx = hX; cy = hY; crot = -8 + (walking? stepA*5 : 0);
  } else {
    const k = ease(seg(t, B.cashLine[0]+0.4, B.cashLine[0]+1.2));
    cop = 1;
    cx = lerp(hX, 1300, k);                               /* prilavkaga qo'yiladi */
    cy = lerp(hY, 648, k);
    crot = lerp(-8, 0, k);
    if(t >= B.scan[0]){                                   /* skaner ustidan o'tkaziladi */
      const s = seg(t, B.scan[0], B.scan[1]);
      cx = lerp(1300, 1120, ease(s));
      cy = 648 - Math.sin(s*Math.PI)*46;
      crot = Math.sin(s*Math.PI*2)*12;
    }
  }
  canG.setAttribute('opacity', cop);
  T(canG, `translate(${cx.toFixed(1)},${cy.toFixed(1)}) rotate(${crot.toFixed(1)})`);

  /* ── KASSIR ── */
  T($('cashier'), `translate(1500,${(FLOOR - Math.sin(t*1.1)*2).toFixed(1)})`);
  T($('cashBody'), `translate(0,-190)`);
  T($('cashHead'), `translate(0,-352) rotate(${(Math.sin(t*0.9)*2).toFixed(2)})`);
  const cashTalking = (t >= B.cashLine[0] && t <= B.cashLine[1]);
  let cA1 = 16, cA2 = 26, cB1 = -14, cB2 = 30;
  if(cashTalking){
    const w = Math.sin((t-B.cashLine[0])*5);
    cA1 = -70 + w*18; cA2 = 44 - w*12;
  }
  if(t >= B.scan[0]-0.3 && t <= B.scan[1]+0.3){
    const s = seg(t, B.scan[0]-0.3, B.scan[1]+0.3);
    cA1 = lerp(-30, -86, Math.sin(s*Math.PI)); cA2 = 50;
  }
  poseArm($('cashArmF'), $('cashElbowF'), cA1, cA2, -318);
  poseArm($('cashArmB'), $('cashElbowB'), cB1, cB2, -318);
  mouthTalk($('cashMouth'), $('cashSmile'), cashTalking, t, 22);
  blink($('cashEyeL'), $('cashEyeR'), t, 1.7);

  /* ── kamera ── */
  const camK = clamp((bx + 180) / 1310, 0, 1);
  const camX = -lerp(0, 340, ease(camK));
  const zoomIn = seg(t, B.cashLine[0]-0.8, B.cashLine[0]+0.4) * 0.10
               - seg(t, B.outro[0]-0.6, B.outro[0]) * 0.10;
  const sc = 1 + zoomIn;
  const camY = -lerp(0, 60, ease(camK)) - zoomIn*120;
  T($('cam'), `translate(${(960 + camX*sc - 960*sc).toFixed(1)},${(camY).toFixed(1)}) scale(${sc.toFixed(4)})`);

  /* ── eshik ochiladi ── */
  const dk = seg(t, 0.0, 1.1) - seg(t, 2.6, 3.6);
  T($('doorPanel'), `translate(${(-clamp(dk,0,1)*150).toFixed(1)},0) scale(${(1-clamp(dk,0,1)*0.35).toFixed(3)},1)`);

  /* ── gap puffaklari ── */
  const bc = $('bubbleCash');
  const bcK = seg(t, B.cashLine[0]-0.25, B.cashLine[0]+0.2) - seg(t, B.cashLine[1]-0.1, B.cashLine[1]+0.35);
  bc.setAttribute('opacity', clamp(bcK,0,1).toFixed(3));
  T(bc, `translate(1080,190) scale(${(0.86 + 0.14*easeOut(clamp(bcK,0,1))).toFixed(3)})`);

  const bb = $('bubbleBoy');
  const bbK = seg(t, B.boyLine[0]-0.2, B.boyLine[0]+0.25) - seg(t, B.boyLine[1]-0.1, B.boyLine[1]+0.35);
  bb.setAttribute('opacity', clamp(bbK,0,1).toFixed(3));
  T(bb, `translate(400,150) scale(${(0.86 + 0.14*easeOut(clamp(bbK,0,1))).toFixed(3)})`);

  const sh = $('shock');
  const shK = seg(t, B.boyLine[0]-0.3, B.boyLine[0]) - seg(t, B.boyLine[0]+0.7, B.boyLine[0]+1.1);
  sh.setAttribute('opacity', clamp(shK,0,1).toFixed(3));
  T(sh, `translate(${(bx + 215).toFixed(1)},${(FLOOR - 372 - jump).toFixed(1)}) scale(${(0.6+0.6*easeOut(clamp(shK,0,1))).toFixed(3)})`);

  /* ── eski usul yo'qoladi, POS paydo bo'ladi ── */
  const posK = ease(seg(t, B.posIn[0], B.posIn[1]));
  $('oldWay').setAttribute('opacity', (1-posK).toFixed(3));
  $('pos').setAttribute('opacity', posK.toFixed(3));
  T($('pos'), `translate(0,${((1-posK)*60).toFixed(1)}) scale(1)`);

  const scanK = (t >= B.scan[0] && t <= B.scan[1]) ? 1 : 0;
  $('beam').setAttribute('opacity', scanK ? (0.55 + 0.45*Math.abs(Math.sin(t*18))).toFixed(3) : 0);
  $('posPrice').textContent = (t > B.scan[0]+0.7) ? TL.price : (posK>0.5 ? '···' : '—');

  const rk = seg(t, B.scan[1], B.scan[1]+1.4);            /* chek chiqadi */
  $('receipt').setAttribute('opacity', rk>0?1:0);
  $('receiptPaper').setAttribute('height', (10 + rk*120).toFixed(1));
  let rl = '';
  for(let i=0;i<6;i++){
    const yy = 578 + i*18;
    if(rk*120 > (i+1)*18) rl += `<rect x="1572" y="${yy}" width="${i%2?70:96}" height="6" rx="3"/>`;
  }
  $('receiptLines').innerHTML = rl;

  /* ── yakuniy ekran ── */
  const ok = ease(seg(t, B.outro[0], B.outro[0]+0.7));
  $('outro').setAttribute('opacity', ok.toFixed(3));
  T($('outroLogo'), `translate(0,${((1-ok)*40).toFixed(1)}) scale(1)`);
  const obk = seg(t, B.outro[0]+0.6, B.outro[0]+1.5);
  $('outroBullets').setAttribute('opacity', obk.toFixed(3));

  SPARKS.forEach((s,i) => {
    const st = B.outro[0] + 0.3 + (i%13)*0.055;
    const k = seg(t, st, st+1.6);
    if(k<=0 || k>=1 || ok<0.2){ s.setAttribute('opacity',0); return; }
    const ang = (i/SPARKS.length)*Math.PI*2 + (i%3);
    const rad = 90 + k*420;
    s.setAttribute('cx', (960 + Math.cos(ang)*rad*1.25).toFixed(1));
    s.setAttribute('cy', (420 + Math.sin(ang)*rad*0.75).toFixed(1));
    s.setAttribute('opacity', ((1-k)*0.9).toFixed(3));
  });
};

SEEK(0);
</script>
