<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>MUHASIB — Real People + Real Hand Marker + Vector Whiteboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #f8fafc;
      font-family: 'Kalam', cursive, sans-serif;
      position: relative;
      user-select: none;
    }

    /* Soft grid whiteboard background */
    .board-bg {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(#cbd5e1 1.5px, transparent 1.5px),
        radial-gradient(#cbd5e1 1.5px, #f8fafc 1.5px);
      background-size: 36px 36px;
      background-position: 0 0, 18px 18px;
      opacity: 0.6;
    }

    /* Main SVG Drawing Canvas for Vector Elements */
    svg.canvas {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      z-index: 10;
    }

    /* Vector Path Stroke Styles */
    .draw-stroke {
      fill: none;
      stroke: #1e293b;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .draw-blue {
      fill: none;
      stroke: #2563eb;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .draw-red {
      fill: none;
      stroke: #dc2626;
      stroke-width: 5.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .draw-green {
      fill: none;
      stroke: #16a34a;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .draw-gold {
      fill: none;
      stroke: #d97706;
      stroke-width: 5.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Typography */
    .wb-title {
      font-family: 'Kalam', cursive;
      font-size: 54px;
      font-weight: 700;
      fill: #1e3a8a;
    }
    .wb-subtitle {
      font-family: 'Kalam', cursive;
      font-size: 36px;
      font-weight: 700;
      fill: #1e293b;
    }
    .wb-text-red {
      font-family: 'Kalam', cursive;
      font-size: 38px;
      font-weight: 700;
      fill: #dc2626;
    }
    .wb-text-green {
      font-family: 'Kalam', cursive;
      font-size: 36px;
      font-weight: 700;
      fill: #15803d;
    }

    /* Real Photo Cutout Layer */
    .real-people-layer {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }
    .person-cutout {
      position: absolute;
      transition: opacity 0.3s ease, transform 0.3s ease;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.25));
    }

    /* Real Photo Hand Marker Container */
    #real-hand-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 400px;
      height: 400px;
      z-index: 999;
      pointer-events: none;
      transform: translate(1920px, 1080px);
      filter: drop-shadow(12px 20px 15px rgba(15, 23, 42, 0.35));
    }
    #real-hand-img {
      width: 400px;
      height: 400px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- Real People Photo Cutouts Layer -->

    <!-- ================= SCENE 1: MUAMMO (0s - 5.5s) ================= -->

      <path id="s1-title-box" class="draw-red" d="M 600,60 L 1320,60 L 1310,135 L 610,135 Z" />

        <path id="s3-c2-icon" class="draw-blue" stroke-width="5" d="M 1060,210 L 1130,170 L 1200,210 L 1200,290 L 1130,330 L 1060,290 Z M 1060,210 L 1130,250 L 1200,210 M 1130,250 L 1130,330" />

      <!-- Card 3 -->

        <path id="s3-c3-box" class="draw-stroke" stroke-width="4" d="M 120,530 L 910,530 L 910,990 L 120,990 Z" />

        <path id="s3-c3-check" class="draw-green" stroke-width="7" d="M 830,570 L 860,600 L 900,550" />

    <!-- ================= SCENE 4: YAKUN (19.5s - 25.5s) ================= -->

  </svg>

  <!-- ================= REAL PHOTO HAND MARKER ================= -->
  <div id="real-hand-wrapper">
    <img id="real-hand-img" src="layers/real_hand_pen.png" alt="Real Photo Hand Marker">
  </div>

  <script>
    window.DURATION = 25.5;

    function seg(t, t0, t1) {
      if (t <= t0) return 0;
      if (t >= t1) return 1;
      return (t - t0) / (t1 - t0);
    }

    const pathElements = [];
    document.querySelectorAll('path[id]').forEach(path => {
      try {
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
        pathElements.push({ id: path.id, el: path, len: len });
      } catch(e) {}
    });

    function drawStroke(id, progress) {
      const item = pathElements.find(p => p.id === id);
      if (!item) return { x: 960, y: 540 };
      const pClamped = Math.max(0, Math.min(1, progress));
      item.el.style.strokeDashoffset = item.len * (1 - pClamped);
      try {
        const pt = item.el.getPointAtLength(item.len * pClamped);
        return { x: pt.x, y: pt.y };
      } catch(e) {
        return { x: 960, y: 540 };
      }
    }

    function writeText(id, fullStr, progress, xStart, yStart, xEnd) {
      const el = document.getElementById(id);
      if (!el) return { x: xStart, y: yStart };
      const pClamped = Math.max(0, Math.min(1, progress));
      const chars = Math.floor(fullStr.length * pClamped);
      el.textContent = fullStr.substring(0, chars);
      const currentX = xStart + (xEnd - xStart) * pClamped;
      return { x: currentX, y: yStart };
    }

    // Real Photo Marker Tip Offset calibration (tip detected at x=185, y=762 in 1024x1024, scaled to 400px width => offset ~72px, 298px)
    const handWrapper = document.getElementById('real-hand-wrapper');
    function setHandPos(x, y, opacity = 1) {
      const handX = x - 72;
      const handY = y - 298;
      handWrapper.style.transform = `translate(${handX}px, ${handY}px)`;
      handWrapper.style.opacity = opacity;
    }

    const realMerchant = document.getElementById('real-merchant-img');
    const realCashier = document.getElementById('real-cashier-img');

    const scene1 = document.getElementById('scene-1');
    const scene2 = document.getElementById('scene-2');
    const scene3 = document.getElementById('scene-3');
    const scene4 = document.getElementById('scene-4');

    window.SEEK = function(t) {
      let handPt = { x: 1750, y: 950 };

      // ---------------- SCENE 1 (0.0s - 5.5s) ----------------
      if (t < 5.5) {
        scene1.style.opacity = 1; scene2.style.opacity = 0; scene3.style.opacity = 0; scene4.style.opacity = 0;

        // Show Real Worried Merchant Photo Cutout
        const mP = seg(t, 0.2, 0.8);
        realMerchant.style.opacity = mP;
        realMerchant.style.transform = `translateY(${(1 - mP) * 50}px)`;
        realCashier.style.opacity = 0;

        if (t >= 0.2 && t < 1.2) {
          drawStroke('s1-title-box', seg(t, 0.2, 0.8));
          handPt = writeText('s1-title-text', "KASSADAGI MUAMMO?", seg(t, 0.5, 1.2), 660, 115, 1250);
        } else if (t >= 1.2) {
          drawStroke('s1-title-box', 1); writeText('s1-title-text', "KASSADAGI MUAMMO?", 1, 660, 115, 1250);
        }

        if (t >= 1.2 && t < 3.0) {
          drawStroke('s1-notebook', seg(t, 1.2, 2.0));
          handPt = drawStroke('s1-calc', seg(t, 2.0, 3.0));
        } else if (t >= 3.0) {
          drawStroke('s1-notebook', 1); drawStroke('s1-calc', 1);
        }

        if (t >= 3.0 && t < 5.5) {
          drawStroke('s1-cross-1', seg(t, 3.0, 3.6));
          handPt = drawStroke('s1-cross-2', seg(t, 3.6, 4.2));
          writeText('s1-subtext-1', "❌ Daftarlarda chalkashlik va dasta navbatlar...", seg(t, 4.0, 4.8), 720, 620, 1400);
          handPt = writeText('s1-subtext-2', "❌ Soliq va kassa tushumida xatoliklar!", seg(t, 4.7, 5.5), 720, 680, 1400);
        } else if (t >= 5.5) {
          drawStroke('s1-cross-1', 1); drawStroke('s1-cross-2', 1);
          writeText('s1-subtext-1', "❌ Daftarlarda chalkashlik va dasta navbatlar...", 1, 720, 620, 1400);
          writeText('s1-subtext-2', "❌ Soliq va kassa tushumida xatoliklar!", 1, 720, 680, 1400);
        }
      }

      // ---------------- SCENE 2 (5.5s - 12.5s) ----------------
      else if (t >= 5.5 && t < 12.5) {
        scene1.style.opacity = Math.max(0, 1 - seg(t, 5.5, 6.0));
        scene2.style.opacity = seg(t, 5.5, 6.0);
        scene3.style.opacity = 0; scene4.style.opacity = 0;

        realMerchant.style.opacity = Math.max(0, 1 - seg(t, 5.5, 6.0));

        // Show Real Happy Cashier Photo Cutout
        const cP = seg(t, 6.0, 6.8);
        realCashier.style.opacity = cP;
        realCashier.style.transform = `translateY(${(1 - cP) * 50}px)`;

        if (t >= 5.8 && t < 7.2) {
          drawStroke('s2-box', seg(t, 5.8, 6.5));
          drawStroke('s2-banner', seg(t, 6.3, 6.8));
          handPt = writeText('s2-banner-text', "YECHIM: MUHASIB POS KASSA", seg(t, 6.6, 7.2), 550, 142, 1300);
        } else if (t >= 7.2) {
          drawStroke('s2-box', 1); drawStroke('s2-banner', 1);
          writeText('s2-banner-text', "YECHIM: MUHASIB POS KASSA", 1, 550, 142, 1300);
        }

        if (t >= 7.2 && t < 9.5) {
          drawStroke('s2-t-base', seg(t, 7.2, 7.6));
          drawStroke('s2-t-screen', seg(t, 7.6, 8.2));
          drawStroke('s2-t-ui1', seg(t, 8.2, 8.6));
          drawStroke('s2-t-ui2', seg(t, 8.6, 8.9));
          handPt = drawStroke('s2-t-ui3', seg(t, 8.9, 9.5));
        } else if (t >= 9.5) {
          ['s2-t-base', 's2-t-screen', 's2-t-ui1', 's2-t-ui2', 's2-t-ui3'].forEach(id => drawStroke(id, 1));
        }

        if (t >= 9.5 && t < 11.2) {
          drawStroke('s2-sc-gun', seg(t, 9.5, 9.9));
          drawStroke('s2-sc-laser', seg(t, 9.9, 10.2));
          drawStroke('s2-pr-box', seg(t, 10.2, 10.5));
          drawStroke('s2-pr-paper', seg(t, 10.5, 10.8));
          drawStroke('s2-pr-lines', seg(t, 10.8, 11.0));
          handPt = drawStroke('s2-pr-check', seg(t, 11.0, 11.2));
        } else if (t >= 11.2) {
          ['s2-sc-gun', 's2-sc-laser', 's2-pr-box', 's2-pr-paper', 's2-pr-lines', 's2-pr-check'].forEach(id => drawStroke(id, 1));
        }

        if (t >= 11.2 && t < 12.5) {
          handPt = writeText('s2-subtext', "✨ Savdoni 100% avtomatlashtiruvchi aqlli dastur!", seg(t, 11.2, 12.5), 180, 740, 1100);
        } else if (t >= 12.5) {
          writeText('s2-subtext', "✨ Savdoni 100% avtomatlashtiruvchi aqlli dastur!", 1, 180, 740, 1100);
        }
      }

      // ---------------- SCENE 3 (12.5s - 19.5s) ----------------

          writeText('s3-c1-t2', "• Shtrix-kod bilan tovarlarni", 1, 150, 310, 650);

        }

        // Card 4
        if (t >= 18.0 && t < 19.5) {
          drawStroke('s3-c4-box', seg(t, 18.0, 18.3));

      // ---------------- SCENE 4 (19.5s - 25.5s) ----------------
      else if (t >= 19.5) {

          handPt = drawStroke('s4-final-check', seg(t, 23.2, 24.2));
        } else {
          ['s4-contact-box', 's4-phone-icon', 's4-web-icon', 's4-final-check'].forEach(id => drawStroke(id, 1));
          writeText('s4-logo-text', "MUHASIB POS KASSA", 1, 610, 650, 1350);
          writeText('s4-phone-text', "+998 (90) 123-45-67", 1, 490, 800, 950);
          writeText('s4-web-text', "www.muhasib.uz", 1, 1200, 800, 1550);

      }

      if (handPt && handPt.x !== undefined && handPt.y !== undefined) {
        setHandPos(handPt.x, handPt.y, 1);
      } else {
        setHandPos(1800, 950, 0.5);
      }
    };
