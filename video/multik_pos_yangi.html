<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>MUHASIB POS — Yangi Reklama Rolik</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0f19; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  svg { display: block; width: 100vw; height: 100vh; }
  text { font-family: 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Gradients -->
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0f172a"/>
    <stop offset="100%" stop-color="#070a12"/>
  </linearGradient>

  <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1e293b"/>
    <stop offset="100%" stop-color="#0f172a"/>
  </linearGradient>

  <linearGradient id="counterGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1e293b"/>
    <stop offset="100%" stop-color="#0f172a"/>
  </linearGradient>

  <linearGradient id="posGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2563eb"/>
    <stop offset="100%" stop-color="#1d4ed8"/>
  </linearGradient>

  <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="50%" stop-color="#818cf8"/>
    <stop offset="100%" stop-color="#c084fc"/>
  </linearGradient>

  <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
  </linearGradient>

  <!-- Filters -->
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
  </filter>
  <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- STAGE CAMERA -->
<g id="cam">
  <!-- Background Wall & Grid -->
  <rect x="-400" y="0" width="3000" height="850" fill="url(#bgGrad)"/>
  
  <!-- Modern store shelves in background -->
  <g opacity="0.3">
    <rect x="100" y="200" width="400" height="20" rx="6" fill="#334155"/>
    <rect x="100" y="380" width="400" height="20" rx="6" fill="#334155"/>
    <rect x="100" y="560" width="400" height="20" rx="6" fill="#334155"/>
    
    <!-- Shelf items -->
    <rect x="130" y="140" width="50" height="60" rx="4" fill="#3b82f6"/>
    <rect x="190" y="130" width="40" height="70" rx="4" fill="#10b981"/>
    <rect x="240" y="150" width="60" height="50" rx="4" fill="#f59e0b"/>
    <rect x="310" y="120" width="45" height="80" rx="4" fill="#ec4899"/>
    
    <rect x="140" y="320" width="55" height="60" rx="4" fill="#8b5cf6"/>
    <rect x="210" y="300" width="45" height="80" rx="4" fill="#06b6d4"/>
    <rect x="270" y="330" width="70" height="50" rx="4" fill="#ef4444"/>
  </g>

  <!-- Floor -->
  <rect x="-400" y="850" width="3000" height="400" fill="url(#floorGrad)"/>
  <line x1="-400" y1="850" x2="2600" y2="850" stroke="#334155" stroke-width="4"/>

  <!-- POS Counter Table -->
  <g id="counter">
    <rect x="1050" y="580" width="750" height="270" rx="16" fill="url(#counterGrad)" stroke="#334155" stroke-width="4" filter="url(#shadow)"/>
    <rect x="1030" y="560" width="790" height="30" rx="10" fill="#334155"/>
    <!-- POS Terminal Unit -->
    <g id="posUnit" transform="translate(1320, 320)">
      <!-- Stand Base -->
      <rect x="90" y="210" width="100" height="35" rx="8" fill="#1e293b" stroke="#475569" stroke-width="3"/>
      <rect x="130" y="140" width="20" height="80" rx="4" fill="#334155"/>
      <!-- Monitor Frame -->
      <rect x="20" y="0" width="240" height="150" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="4" filter="url(#neonGlow)"/>
      <!-- Screen content -->
      <rect x="30" y="10" width="220" height="130" rx="8" fill="#1e293b"/>
      <!-- Header Bar on Screen -->
      <rect x="30" y="10" width="220" height="30" rx="4" fill="#2563eb"/>
      <text x="40" y="30" font-size="14" font-weight="bold" fill="#ffffff">MUHASIB POS v2.0</text>
      <circle cx="235" cy="25" r="5" fill="#10b981"/>
      
      <!-- Dashboard UI Mock -->
      <rect x="40" y="50" width="90" height="40" rx="4" fill="#0f172a"/>
      <text x="45" y="65" font-size="10" fill="#94a3b8">Jami tushum</text>
      <text x="45" y="82" font-size="12" font-weight="bold" fill="#10b981">1,250,000 UZS</text>

      <rect x="140" y="50" width="100" height="40" rx="4" fill="#0f172a"/>
      <text x="145" y="65" font-size="10" fill="#94a3b8">Sotilgan mahsulot</text>
      <text x="145" y="82" font-size="12" font-weight="bold" fill="#38bdf8">148 ta</text>

      <rect x="40" y="98" width="200" height="30" rx="4" fill="#10b981"/>
      <text x="85" y="118" font-size="13" font-weight="bold" fill="#ffffff">SKANERLANDI ✓</text>
    </g>

    <!-- Barcode Scanner -->
    <g id="scanner" transform="translate(1220, 500)">
      <path d="M10,0 L30,0 L35,40 L5,40 Z" fill="#334155"/>
      <rect x="5" y="40" width="30" height="25" rx="4" fill="#1e293b"/>
      <circle cx="20" cy="50" r="4" fill="#ef4444"/>
    </g>
    <!-- Laser Beam -->
    <polygon id="laserBeam" points="1235,505 1100,560 1100,570 1235,510" fill="#ef4444" opacity="0" filter="url(#neonGlow)"/>

    <!-- Receipt Printer & Receipt -->
    <g id="printer" transform="translate(1600, 520)">
      <rect x="0" y="0" width="90" height="50" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <rect x="15" y="10" width="60" height="8" rx="2" fill="#0f172a"/>
      
      <!-- Receipt Paper Animation -->
      <g id="receiptPaper" transform="translate(20, 18)" opacity="0">
        <rect id="paperRect" x="0" y="0" width="50" height="0" fill="#f8fafc" rx="2"/>
        <g id="paperText" opacity="0.7">
          <line x1="6" y1="10" x2="44" y2="10" stroke="#64748b" stroke-width="2"/>
          <line x1="6" y1="18" x2="30" y2="18" stroke="#64748b" stroke-width="2"/>
          <line x1="6" y1="26" x2="40" y2="26" stroke="#64748b" stroke-width="2"/>
          <line x1="6" y1="34" x2="44" y2="34" stroke="#10b981" stroke-width="3"/>
        </g>
      </g>
    </g>
  </g>

  <!-- CHARACTER 1: SHOP OWNER / CUSTOMER (Erkak - Sardor) -->
  <g id="charOwner" transform="translate(450, 480)">
    <!-- Shadow -->
    <ellipse cx="0" cy="380" rx="80" ry="18" fill="#000000" opacity="0.4"/>
    
    <!-- Legs -->
    <line id="ownerLegL" x1="-25" y1="200" x2="-25" y2="370" stroke="#1e293b" stroke-width="32" stroke-linecap="round"/>
    <line id="ownerLegR" x1="25" y1="200" x2="25" y2="370" stroke="#1e293b" stroke-width="32" stroke-linecap="round"/>
    <ellipse cx="-25" cy="375" rx="24" ry="12" fill="#090d16"/>
    <ellipse cx="25" cy="375" rx="24" ry="12" fill="#090d16"/>

    <!-- Torso / Jacket -->
    <path d="M-55,50 L55,50 L45,210 L-45,210 Z" fill="#2563eb" rx="10"/>
    <!-- Shirt Collar -->
    <polygon points="-15,50 0,90 15,50" fill="#ffffff"/>
    <polygon points="-5,50 0,110 5,50" fill="#dc2626"/>

    <!-- Arms -->
    <g id="ownerArmL">
      <line x1="-55" y1="65" x2="-80" y2="150" stroke="#1d4ed8" stroke-width="24" stroke-linecap="round"/>
      <circle cx="-80" cy="155" r="14" fill="#f87171"/>
    </g>
    <g id="ownerArmR">
      <line id="ownerArmRLine" x1="55" y1="65" x2="85" y2="140" stroke="#1d4ed8" stroke-width="24" stroke-linecap="round"/>
      <!-- Smartphone in hand -->
      <g id="ownerPhone" transform="translate(85, 130)">
        <rect x="-12" y="-22" width="24" height="44" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
        <rect x="-9" y="-18" width="18" height="34" rx="2" fill="#38bdf8" opacity="0.8"/>
      </g>
      <circle cx="85" cy="140" r="14" fill="#f87171"/>
    </g>

    <!-- Head & Face -->
    <g id="ownerHead" transform="translate(0, -10)">
      <circle cx="0" cy="0" r="50" fill="#f87171"/>
      <!-- Hair -->
      <path d="M-52,-10 C-50,-65 50,-65 52,-10 C40,-40 -40,-40 -52,-10 Z" fill="#1e1b4b"/>
      <!-- Eyes -->
      <circle cx="-16" cy="-5" r="6" fill="#0f172a"/>
      <circle cx="16" cy="-5" r="6" fill="#0f172a"/>
      <circle cx="-14" cy="-7" r="2" fill="#ffffff"/>
      <circle cx="18" cy="-7" r="2" fill="#ffffff"/>
      <!-- Eyebrows -->
      <line x1="-26" y1="-18" x2="-8" y2="-18" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round"/>
      <line x1="8" y1="-18" x2="26" y2="-18" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round"/>
      <!-- Mouth -->
      <path id="ownerMouth" d="M-15,20 Q0,25 15,20" fill="none" stroke="#7f1d1d" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- CHARACTER 2: CASHIER / CONSULTANT (Ayol - Madina) -->
  <g id="charCashier" transform="translate(1150, 430)">
    <!-- Shadow -->
    <ellipse cx="0" cy="430" rx="70" ry="16" fill="#000000" opacity="0.4"/>

    <!-- Body / Dress Uniform -->
    <path d="M-45,60 L45,60 L55,240 L-55,240 Z" fill="#059669" rx="10"/>
    <!-- MUHASIB Badge -->
    <rect x="-35" y="80" width="35" height="20" rx="3" fill="#ffffff"/>
    <text x="-32" y="94" font-size="9" font-weight="bold" fill="#059669">POS</text>

    <!-- Arms -->
    <g id="cashierArmL">
      <line id="cashierArmLLine" x1="-45" y1="75" x2="-75" y2="150" stroke="#047857" stroke-width="20" stroke-linecap="round"/>
      <circle cx="-75" cy="150" r="12" fill="#fca5a5"/>
    </g>
    <g id="cashierArmR">
      <line id="cashierArmRLine" x1="45" y1="75" x2="80" y2="140" stroke="#047857" stroke-width="20" stroke-linecap="round"/>
      <circle cx="80" cy="140" r="12" fill="#fca5a5"/>
    </g>

    <!-- Head & Face -->
    <g id="cashierHead" transform="translate(0, 0)">
      <circle cx="0" cy="0" r="46" fill="#fca5a5"/>
      <!-- Hair (hijab / stylish dark hair) -->
      <path d="M-50,0 C-50,-60 50,-60 50,0 C50,45 35,55 30,55 C0,45 -30,55 -50,0 Z" fill="#0f172a"/>
      <!-- Eyes -->
      <circle cx="-15" cy="-2" r="5" fill="#0f172a"/>
      <circle cx="15" cy="-2" r="5" fill="#0f172a"/>
      <circle cx="-13" cy="-4" r="2" fill="#ffffff"/>
      <circle cx="17" cy="-4" r="2" fill="#ffffff"/>
      <!-- Eyelashes -->
      <path d="M-22,-8 L-15,-6" stroke="#0f172a" stroke-width="2"/>
      <path d="M22,-8 L15,-6" stroke="#0f172a" stroke-width="2"/>
      <!-- Smile Mouth -->
      <path id="cashierMouth" d="M-12,18 Q0,28 12,18" fill="none" stroke="#991b1b" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- SPEECH BUBBLES -->
  <!-- Cashier Speech Bubble -->
  <g id="bubbleCashier" transform="translate(1020, 140)" opacity="0">
    <path d="M0,0 L320,0 Q340,0 340,20 L340,110 Q340,130 320,130 L100,130 L60,165 L70,130 L20,130 Q0,130 0,110 Z" fill="#ffffff" filter="url(#shadow)"/>
    <text x="20" y="35" font-size="18" font-weight="bold" fill="#059669">Assalomu alaykum!</text>
    <text x="20" y="65" font-size="16" fill="#1e293b">MUHASIB POS kassa dasturi bilan</text>
    <text x="20" y="90" font-size="16" fill="#1e293b">savdo 3x tezlashadi va aniq bo'ladi!</text>
  </g>

  <!-- Owner Speech Bubble -->
  <g id="bubbleOwner" transform="translate(320, 140)" opacity="0">
    <path d="M0,0 L340,0 Q360,0 360,20 L360,110 Q360,130 340,130 L260,130 L280,165 L240,130 L20,130 Q0,130 0,110 Z" fill="#ffffff" filter="url(#shadow)"/>
    <text x="20" y="35" font-size="18" font-weight="bold" fill="#2563eb">Ajoyib-ku!</text>
    <text x="20" y="65" font-size="16" fill="#1e293b">Telefondan ombor va tushumni</text>
    <text x="20" y="90" font-size="16" fill="#1e293b">kuzatsa bo'ladimi?</text>
  </g>

  <!-- FEATURE CARDS POPUP (Line 3) -->
  <g id="featureCards" transform="translate(480, 200)" opacity="0">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="300" height="90" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="3" filter="url(#shadow)"/>
      <circle cx="45" cy="45" r="24" fill="#0284c7"/>
      <text x="35" y="53" font-size="24">⚡</text>
      <text x="85" y="40" font-size="16" font-weight="bold" fill="#ffffff">Super Tez Skaner</text>
      <text x="85" y="62" font-size="14" fill="#94a3b8">1 sekundda mahsulot kiritish</text>
    </g>

    <g transform="translate(330, 0)">
      <rect x="0" y="0" width="300" height="90" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="3" filter="url(#shadow)"/>
      <circle cx="45" cy="45" r="24" fill="#059669"/>
      <text x="35" y="53" font-size="24">📱</text>
      <text x="85" y="40" font-size="16" font-weight="bold" fill="#ffffff">Mobil Boshqaruv</text>
      <text x="85" y="62" font-size="14" fill="#94a3b8">Ombor va savdo telefonda</text>
    </g>

    <g transform="translate(660, 0)">
      <rect x="0" y="0" width="300" height="90" rx="16" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="3" filter="url(#shadow)"/>
      <circle cx="45" cy="45" r="24" fill="#7c3aed"/>
      <text x="35" y="53" font-size="24">📊</text>
      <text x="85" y="40" font-size="16" font-weight="bold" fill="#ffffff">Aniq Hisobotlar</text>
      <text x="85" y="62" font-size="14" fill="#94a3b8">Foyda va analitika avto</text>
    </g>
  </g>

  <!-- OUTRO SCREEN -->
  <g id="outro" opacity="0">
    <rect x="-400" y="-100" width="3000" height="1400" fill="#070a12" opacity="0.95"/>
    
    <g transform="translate(960, 420)">
      <!-- Main Logo Icon -->
      <rect x="-100" y="-180" width="200" height="120" rx="24" fill="url(#glowGrad)" filter="url(#neonGlow)"/>
      <text x="0" y="-105" text-anchor="middle" font-size="52" font-weight="900" fill="#ffffff">POS</text>

      <!-- Brand Title -->
      <text x="0" y="0" text-anchor="middle" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="4">MUHASIB POS</text>

      <text x="0" y="60" text-anchor="middle" font-size="32" font-weight="600" fill="#38bdf8">Do'koningiz Uchun №1 Kassa Dasturi</text>

      <!-- CTA Box -->
      <rect x="-240" y="120" width="480" height="70" rx="35" fill="url(#posGrad)" filter="url(#neonGlow)"/>
      <text x="0" y="165" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">📞 HOZIRAQ ULANING!</text>
    </g>
  </g>
</g>
</svg>

<script>
window.CONFIG = window.CONFIG || {
  duration: 18.0,
  lines: [
    { who: "cashier", start: 1.0, dur: 5.5 },
    { who: "owner",   start: 7.2, dur: 5.0 },
    { who: "cashier", start: 12.8, dur: 4.5 }
  ]
};

window.DURATION = window.CONFIG.duration || 18.0;

function $(id) { return document.getElementById(id); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function seg(t, a, b) { return clamp((t - a) / (b - a || 1), 0, 1); }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

window.SEEK = function(t) {
  const cfg = window.CONFIG;
  const line1 = cfg.lines[0];
  const line2 = cfg.lines[1];
  const line3 = cfg.lines[2];

  // 1. Cashier Animation
  const isCashierTalking = (t >= line1.start && t <= line1.start + line1.dur) || (t >= line3.start && t <= line3.start + line3.dur);
  const cashierMouthPath = $("cashierMouth");
  if (isCashierTalking) {
    const talkCycle = Math.abs(Math.sin(t * 14));
    cashierMouthPath.setAttribute("d", `M-14,18 Q0,${18 + talkCycle * 14} 14,18`);
    $("cashierArmRLine").setAttribute("d", `M45,75 L${75 + Math.sin(t*10)*15},${120 + Math.cos(t*10)*15}`);
  } else {
    cashierMouthPath.setAttribute("d", "M-12,18 Q0,28 12,18");
  }

  // 2. Owner Animation
  const isOwnerTalking = (t >= line2.start && t <= line2.start + line2.dur);
  const ownerMouthPath = $("ownerMouth");
  if (isOwnerTalking) {
    const talkCycle = Math.abs(Math.sin(t * 14));
    ownerMouthPath.setAttribute("d", `M-15,20 Q0,${20 + talkCycle * 12} 15,20`);
    $("ownerArmRLine").setAttribute("d", `M55,65 L${85 + Math.sin(t*8)*10},${130 - Math.abs(Math.cos(t*8))*20}`);
  } else {
    ownerMouthPath.setAttribute("d", "M-15,20 Q0,25 15,20");
  }

  // 3. Speech Bubbles
  const bcK = seg(t, line1.start, line1.start + 0.3) - seg(t, line1.start + line1.dur - 0.3, line1.start + line1.dur);
  $("bubbleCashier").setAttribute("opacity", clamp(bcK, 0, 1).toFixed(2));

  const boK = seg(t, line2.start, line2.start + 0.3) - seg(t, line2.start + line2.dur - 0.3, line2.start + line2.dur);
  $("bubbleOwner").setAttribute("opacity", clamp(boK, 0, 1).toFixed(2));

  // 4. Barcode Scanning Laser Animation (during Line 1)
  const laserK = (t >= line1.start + 2.0 && t <= line1.start + 4.5);
  $("laserBeam").setAttribute("opacity", laserK ? (0.6 + 0.4 * Math.sin(t * 20)).toFixed(2) : "0");

  // Receipt Paper Printing (during Line 1)
  const receiptK = seg(t, line1.start + 2.5, line1.start + 5.0);
  $("receiptPaper").setAttribute("opacity", receiptK > 0 ? "1" : "0");
  $("paperRect").setAttribute("height", (receiptK * 70).toFixed(1));
  $("paperText").setAttribute("opacity", receiptK > 0.4 ? "1" : "0");

  // 5. Feature Cards Popup (during Line 3)
  const fcK = seg(t, line3.start - 0.2, line3.start + 0.5) - seg(t, line3.start + line3.dur, line3.start + line3.dur + 0.5);
  $("featureCards").setAttribute("opacity", clamp(fcK, 0, 1).toFixed(2));
  $("featureCards").setAttribute("transform", `translate(480, ${200 - (1 - easeOut(clamp(fcK,0,1))) * 30})`);

  // 6. Outro screen (after Line 3)
  const outroStart = line3.start + line3.dur + 0.5;
  const outroK = seg(t, outroStart, outroStart + 0.8);
  $("outro").setAttribute("opacity", outroK.toFixed(2));
};

SEEK(0);
</script>
</body>
</html>
